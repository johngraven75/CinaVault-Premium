[package]
name = "cinavault-reimagined"
version = "0.0.1"
description = "CinaVault ReImagined Windows desktop application"
authors = ["CinaVault"]
edition = "2021"

[lib]
name = "cinavault_reimagined_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
