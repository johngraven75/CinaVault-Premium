<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>CinaVault Premium</title>
    <style>
      html, body, #root {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #04070f;
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      /* Splash screen */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background:
          radial-gradient(circle at 20% 25%, rgba(0, 212, 255, 0.22), transparent 46%),
          radial-gradient(circle at 85% 15%, rgba(0, 126, 166, 0.2), transparent 50%),
          linear-gradient(140deg, #03050c 0%, #091321 45%, #04070f 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.8s ease-out;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash h1 {
        font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 2.7rem;
        background: linear-gradient(135deg, #46f6ff, #00d4ff, #ff4d6d);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        margin-bottom: 2rem; letter-spacing: -0.02em;
      }
      #splash-bar-track {
        width: 320px; height: 4px; background: rgba(255,255,255,0.1);
        border-radius: 4px; overflow: hidden;
      }
      #splash-bar {
        height: 100%; width: 0%; border-radius: 4px;
        background: linear-gradient(90deg, #00d4ff, #00a8d6, #ff4d6d);
        transition: width 0.3s ease-out;
      }
      #splash-status {
        color: rgba(255,255,255,0.4); font-size: 0.75rem;
        margin-top: 1rem; font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <h1>CinaVault Premium</h1>
      <div id="splash-bar-track"><div id="splash-bar"></div></div>
      <div id="splash-status">Initializing systems...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
