<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>CinaVault Premium</title>
    <style>
      html, body, #root {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #04070f;
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      /* Splash screen */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background:
          radial-gradient(circle at 20% 25%, rgba(0, 212, 255, 0.22), transparent 46%),
          radial-gradient(circle at 85% 15%, rgba(0, 126, 166, 0.2), transparent 50%),
          linear-gradient(140deg, #03050c 0%, #091321 45%, #04070f 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.8s ease-out;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash h1 {
        font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 2.7rem;
        background: linear-gradient(135deg, #ffffff, #8ff5ff 44%, #19d7ff 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        margin: 1rem 0 2rem; letter-spacing: -0.02em;
        text-shadow: 0 0 24px rgba(60, 220, 255, 0.32);
      }
      #splash-logo-wrap {
        position: relative;
        width: min(86vw, 980px);
        aspect-ratio: 3 / 2;
        display: grid;
        place-items: center;
        isolation: isolate;
        animation: splashFloat 3.2s ease-in-out infinite;
      }
      #splash-logo-wrap::before {
        content: "";
        position: absolute;
        inset: 8% 4% 2%;
        z-index: -1;
        background:
          radial-gradient(circle at 30% 48%, rgba(108, 229, 255, 0.45), transparent 38%),
          radial-gradient(circle at 70% 48%, rgba(40, 150, 255, 0.32), transparent 46%);
        filter: blur(30px);
        animation: splashPulse 2.4s ease-in-out infinite;
      }
      #splash-logo-wrap::after {
        content: "";
        position: absolute;
        left: 7%;
        right: 7%;
        bottom: 5%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(154, 243, 255, 0.9), transparent);
        box-shadow: 0 0 24px rgba(79, 207, 255, 0.92);
      }
      #splash-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter:
          drop-shadow(0 26px 38px rgba(0, 8, 22, 0.78))
          drop-shadow(0 0 22px rgba(43, 198, 255, 0.35));
      }
      #splash-bar-track {
        width: 320px; height: 4px; background: rgba(255,255,255,0.1);
        border-radius: 4px; overflow: hidden;
      }
      #splash-bar {
        height: 100%; width: 0%; border-radius: 4px;
        background: linear-gradient(90deg, #00d4ff, #00a8d6, #ff4d6d);
        transition: width 0.3s ease-out;
      }
      #splash-status {
        color: rgba(255,255,255,0.4); font-size: 0.75rem;
        margin-top: 1rem; font-family: 'JetBrains Mono', monospace;
      }
      @keyframes splashFloat {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-8px) scale(1.012); }
      }
      @keyframes splashPulse {
        0%, 100% { opacity: 0.68; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.04); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-logo-wrap">
        <img id="splash-logo" src="/branding/cinavault-premium-brand-full.png" alt="CineVault Media Server Pro Edition" />
      </div>
      <div id="splash-bar-track"><div id="splash-bar"></div></div>
      <div id="splash-status">Initializing systems...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
