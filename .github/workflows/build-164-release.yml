name: Build 164 Release

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: build-164-release
  cancel-in-progress: false

env:
  BUILD_NUMBER: '164'
  APP_VERSION: '1.6.4'
  INSTALLER_ARTIFACT_NAME: CinaVault-Premium-Windows-Installer-Build164
  RUST_BACKTRACE: '1'

jobs:
  validate:
    name: Validate Build 164
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Run governance tests
        run: npm test

  build:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run Rust