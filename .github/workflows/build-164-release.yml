name: Build 164 Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: build-164-release
  cancel-in-progress: false

env:
  BUILD_NUMBER: '164'
  APP_VERSION: '1.6.4'
  INSTALLER_ARTIFACT_NAME: CinaVault-Premium-Windows-Installer-Build164
  RUST_BACKTRACE: '1'

jobs:
  validate:
    name: Validate Build 164
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Run governance tests
        run: npm test

  build:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --nocapture
      - name: Build Tauri Windows installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc
      - name: Stage installer artifacts and hashes
        shell: pwsh
        run: |
          $stagingDir = 'installer-staging'
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          $bundlePath = 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle'
          Get-ChildItem -Path $bundlePath -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination $stagingDir -Force
          $files = Get-ChildItem $stagingDir -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          if (-not $files) { throw 'No MSI or EXE installer was produced.' }
          $checksums = foreach ($file in $files) {
            $hash = Get-FileHash -Path $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)"
          }
          Set-Content -Path "$stagingDir\SHA256SUMS.txt" -Value $checksums -Encoding utf8
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INSTALLER_ARTIFACT_NAME }}
          path: installer-staging/
          if-no-files-found: error
          compression-level: 9
          retention-days: 15

  release:
    name: Publish v1.6.4
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.INSTALLER_ARTIFACT_NAME }}
          path: artifacts
      - name: Publish Build 164 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.4
          target_commitish: main
          name: CinaVault Premium Build 164
          body: |
            Windows MSI and NSIS installers for CinaVault Premium version 1.6.4.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.msi
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
