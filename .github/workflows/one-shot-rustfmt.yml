name: One-shot Rust formatting

on:
  push:
    branches: [fix/metadata-scan-bundled-vpn]
    paths: [.github/workflows/one-shot-rustfmt.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/metadata-scan-bundled-vpn
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          Remove-Item .github/workflows/one-shot-rustfmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri .github/workflows/one-shot-rustfmt.yml
          git commit -m "style: format Build 170 Rust changes"
          git push origin HEAD:fix/metadata-scan-bundled-vpn
