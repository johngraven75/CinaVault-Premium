name: Apply Build 137 Review Fixes

on:
  push:
    branches:
      - codex/fix-build-137-review-issues

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-build-137-review-issues
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Missing expected block in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = read(path)
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Missing expected pattern in {path}: {pattern[:120]!r}")
              write(path, new_text)

          app_store = "src/store/appStore.ts"
          replace_once(
              app_store,
              '''export type TabId =\n  | "home" | "sources" | "downloads" | "livetv" | "server"\n  | "security" | "remote" | "advanced" | "cloud" | "plugins" | "ai" | "settings";''',
              '''export type TabId =\n  | "home" | "sources" | "downloads" | "livetv" | "server"\n  | "security" | "remote" | "advanced" | "cloud" | "plugins" | "ai" | "settings";\n\nconst VALID_TAB_IDS: readonly TabId[] = [\n  "home",\n  "sources",\n  "downloads",\n  "livetv",\n  "server",\n  "security",\n  "remote",\n  "advanced",\n  "cloud",\n  "plugins",\n  "ai",\n  "settings",\n];\n\nfunction isTabId(value: string): value is TabId {\n  return VALID_TAB_IDS.includes(value as TabId);\n}''',
          )
          replace_once(
              app_store,
              '''  setMediaItems: (items: MediaItem[]) => void;''',
              '''  setMediaItems: (items: MediaItem[] | ((current: MediaItem[]) => MediaItem[])) => void;''',
          )
          replace_once(
              app_store,
              '''  setMediaItems: (items) => set({ mediaItems: items }),''',
              '''  setMediaItems: (items) => set((s) => ({\n    mediaItems: typeof items === "function" ? items(s.mediaItems) : items,\n  })),''',
          )
          replace_once(
              app_store,
              '''        activeTab = value as TabId;''',
              '''        activeTab = isTabId(value) ? value : "home";''',
          )

          replace_once(
              "src/components/Header.tsx",
              '''  const activeMeta = TAB_META[activeTab];''',
              '''  const activeMeta = TAB_META[activeTab] ?? TAB_META.home;''',
          )

          home_tab = "src/components/tabs/HomeTab.tsx"
          regex_once(
              home_tab,
              r'''  const applyUpdatedMediaItem = useCallback\(\(updated: Partial<MediaItem> & \{ id\?: number \}\) => \{.*?  \}, \[mediaItems, selectedMedia, setMediaItems, setSelectedMedia\]\);''',
              '''  const applyUpdatedMediaItem = useCallback((updated: Partial<MediaItem> & { id?: number }) => {\n    const updatedId = updated.id;\n    if (!updatedId) return;\n\n    setMediaItems((current) =>\n      current.map((item) => (item.id === updatedId ? { ...item, ...updated } : item)),\n    );\n\n    if (selectedMedia?.id === updatedId) {\n      setSelectedMedia({ ...selectedMedia, ...updated });\n    }\n  }, [selectedMedia, setMediaItems, setSelectedMedia]);''',
          )
          replace_once(
              home_tab,
              '''  const heroItem = selectedMedia || filteredItems[0] || DEMO_ITEMS[0];\n  const trendingItems = useMemo(() => filteredItems.slice(0, 8), [filteredItems]);''',
              '''  const heroItem = selectedMedia || filteredItems[0] || null;\n  const heroImageSrc = heroItem ? resolveMediaImageSrc(heroItem.backdrop_path || heroItem.poster_path) : undefined;\n  const trendingItems = useMemo(() => filteredItems.slice(0, 8), [filteredItems]);''',
          )
          replace_once(
              home_tab,
              '''  const cardMinWidth = cardStyle === "banner" ? Math.max(260, Math.round(iconSize * 1.72)) : Math.max(118, iconSize);''',
              '''  const cardMinWidth = cardStyle === "banner" ? Math.max(260, Math.round(iconSize * 1.72)) : Math.max(118, iconSize);\n  const reduceCardMotion = filteredItems.length > 500;''',
          )
          regex_once(
              home_tab,
              r'''  const handleVerify = async \(item: MediaItem\): Promise<void> => \{.*?  \};\n\n  const handleCheckMetadata''',
              '''  const handleVerify = async (item: MediaItem): Promise<void> => {\n    if (!item.id) {\n      addStatusMessage(`Verification skipped: ${item.title} has no vault id yet`);\n      return;\n    }\n\n    try {\n      await invoke("verify_media_item", { id: item.id });\n      addStatusMessage(`Verification pulse complete: ${item.title}`);\n      await loadMedia();\n    } catch (error) {\n      addStatusMessage(`Verification pulse failed: ${error}`);\n    }\n  };\n\n  const handleCheckMetadata''',
          )
          regex_once(
              home_tab,
              r'''      <section className="cyber-hero">.*?      </section>\n\n      <section className="grid gap-3 md:grid-cols-3">''',
              '''      <section className="cyber-hero">\n        <MeteorShower meteorCount={34} />\n        {heroImageSrc && (\n          <div\n            className="absolute inset-0 z-0 opacity-30"\n            style={{\n              backgroundImage: `url(${heroImageSrc})`,\n              backgroundSize: "cover",\n              backgroundPosition: "center",\n            }}\n          />\n        )}\n        <div className="absolute inset-0 z-[1] bg-[linear-gradient(90deg,rgba(5,5,10,0.95),rgba(5,5,10,0.52)_45%,rgba(5,5,10,0.82)),radial-gradient(circle_at_80%_22%,rgba(189,0,255,0.24),transparent_36%)]" />\n\n        <div className="relative z-10 grid min-h-[310px] gap-5 p-5 lg:grid-cols-[minmax(0,1fr)_320px]">\n          <div className="flex min-w-0 flex-col justify-end">\n            <div className="cyber-eyebrow mb-2 flex items-center gap-2">\n              <Zap size={14} /> {heroItem ? "Trending Now / Holographic Carousel" : "Vault Empty / Awaiting Scan"}\n            </div>\n            <AnimatePresence mode="wait">\n              <motion.div\n                key={heroItem?.id || heroItem?.title || "empty-vault-hero"}\n                initial={{ opacity: 0, y: 18, filter: "blur(12px)" }}\n                animate={{ opacity: 1, y: 0, filter: "blur(0px)" }}\n                exit={{ opacity: 0, y: -10, filter: "blur(8px)" }}\n                transition={{ duration: 0.32 }}\n              >\n                {heroItem ? (\n                  <>\n                    <h2 className="cyber-title max-w-4xl text-4xl font-black tracking-tight lg:text-6xl">{heroItem.title}</h2>\n                    <div className="mt-3 flex flex-wrap items-center gap-2">\n                      {heroItem.year && <span className="cyber-chip">{heroItem.year}</span>}\n                      <span className="cyber-chip">{heroItem.media_type || "media"}</span>\n                      {heroItem.resolution && <span className="cyber-chip">{heroItem.resolution}</span>}\n                      {heroItem.rating && (\n                        <span className="cyber-chip is-hot"><Star size={12} /> {heroItem.rating}</span>\n                      )}\n                    </div>\n                    {heroItem.overview && (\n                      <p className="mt-4 max-w-3xl text-sm leading-7 text-cv-subtext">{heroItem.overview}</p>\n                    )}\n                  </>\n                ) : (\n                  <>\n                    <h2 className="cyber-title max-w-4xl text-4xl font-black tracking-tight lg:text-6xl">No Media Found</h2>\n                    <p className="mt-4 max-w-3xl text-sm leading-7 text-cv-subtext">Add media sources and scan to populate the holographic vault.</p>\n                  </>\n                )}\n              </motion.div>\n            </AnimatePresence>\n\n            <div className="mt-5 flex flex-wrap gap-2">\n              {heroItem ? (\n                <>\n                  <button type="button" onClick={() => void handlePlay(heroItem)} className="cyber-button">\n                    <Play size={15} /> Quick Play\n                  </button>\n                  <button type="button" onClick={() => setSelectedMedia(heroItem)} className="cyber-button">\n                    <Sparkles size={15} /> Open Terminal Panel\n                  </button>\n                  <button type="button" onClick={() => void handleCheckMetadata(heroItem)} className="cyber-button is-amber">\n                    <Search size={15} /> Check Metadata\n                  </button>\n                </>\n              ) : (\n                <button type="button" onClick={() => void loadMedia()} className="cyber-button">\n                  <RefreshCw size={15} className={loading ? "animate-spin" : ""} /> Refresh Library\n                </button>\n              )}\n            </div>\n          </div>\n\n          <div className="cyber-terminal-panel hidden bg-black/35 p-4 lg:block">\n            <div className="cyber-eyebrow mb-3 flex items-center gap-2"><Activity size={13} /> User Terminal Quick-Stats</div>\n            <TerminalLine label="Watchtime" value={`${watchtimeHours}h`} />\n            <TerminalLine label="Vault Inventory" value={mediaItems.length.toLocaleString()} />\n            <TerminalLine label="Visible Records" value={filteredItems.length.toLocaleString()} />\n            <TerminalLine label="Verified Signal" value={`${verifiedCount} locked`} />\n            <TerminalLine label="System Status" value={autoLoadingLibrary ? "Compiling" : "Nominal"} />\n          </div>\n        </div>\n      </section>\n\n      <section className="grid gap-3 md:grid-cols-3">''',
          )
          replace_once(
              home_tab,
              '''                  index={index}\n                  onSelect={() => setSelectedMedia(item)}''',
              '''                  index={index}\n                  reduceMotion={reduceCardMotion}\n                  onSelect={() => setSelectedMedia(item)}''',
          )
          regex_once(
              home_tab,
              r'''function MediaCard\(\{.*?\n\}\n\nfunction CardVisual''',
              '''function MediaCard({\n  item,\n  styleMode,\n  checking,\n  index,\n  reduceMotion,\n  onSelect,\n  onPlay,\n  onCheckMetadata,\n}: {\n  item: MediaItem;\n  styleMode: CardStyle;\n  checking: boolean;\n  index: number;\n  reduceMotion: boolean;\n  onSelect: () => void;\n  onPlay: () => void;\n  onCheckMetadata: () => void;\n}): JSX.Element {\n  const handlePointerMove = (event: PointerEvent<HTMLDivElement>): void => {\n    const rect = event.currentTarget.getBoundingClientRect();\n    const x = (event.clientX - rect.left) / rect.width - 0.5;\n    const y = (event.clientY - rect.top) / rect.height - 0.5;\n    event.currentTarget.style.setProperty("--tilt-x", `${x * 8}deg`);\n    event.currentTarget.style.setProperty("--tilt-y", `${y * -7}deg`);\n  };\n\n  const resetPointerTilt = (event: PointerEvent<HTMLDivElement>): void => {\n    event.currentTarget.style.setProperty("--tilt-x", "0deg");\n    event.currentTarget.style.setProperty("--tilt-y", "0deg");\n  };\n\n  const cardContent = (\n    <>\n      <CardVisual item={item} styleMode={styleMode} />\n      <div className="relative z-10 p-3">\n        <h4 className="truncate text-sm font-black text-cv-text">{item.title}</h4>\n        <div className="mt-1 flex flex-wrap items-center gap-2 text-[10px] uppercase tracking-[0.08em] text-cv-subtext">\n          {item.year && <span>{item.year}</span>}\n          <span>{item.media_type}</span>\n          {item.resolution && <span className="text-cyan-200">{item.resolution}</span>}\n        </div>\n        {item.genre && <div className="mt-2 truncate text-[11px] text-cv-subtext/80">{item.genre}</div>}\n      </div>\n      <div className="cyber-card-actions">\n        <button\n          type="button"\n          onClick={(event) => {\n            event.stopPropagation();\n            onPlay();\n          }}\n          className="cyber-button flex-1 text-[10px]"\n        >\n          <span className="cyber-bracket">[▶]</span> Play\n        </button>\n        <button\n          type="button"\n          onClick={(event) => {\n            event.stopPropagation();\n            onCheckMetadata();\n          }}\n          disabled={checking}\n          className="cyber-button flex-1 text-[10px] disabled:opacity-60"\n        >\n          {checking ? <RefreshCw size={12} className="animate-spin" /> : <Search size={12} />}\n          <span className="metadata-action-label">{checking ? "Checking..." : "Check Metadata"}</span>\n        </button>\n      </div>\n    </>\n  );\n\n  if (reduceMotion) {\n    return (\n      <div className="cyber-card group" onClick={onSelect}>\n        {cardContent}\n      </div>\n    );\n  }\n\n  return (\n    <motion.div\n      className="cyber-card group"\n      initial={{ opacity: 0, y: 14 }}\n      animate={{ opacity: 1, y: 0 }}\n      transition={{ delay: Math.min(index * 0.025, 0.45) }}\n      onClick={onSelect}\n      onPointerMove={handlePointerMove}\n      onPointerLeave={resetPointerTilt}\n    >\n      {cardContent}\n    </motion.div>\n  );\n}\n\nfunction CardVisual''',
          )

          css = "src/styles/cyber-hud.css"
          for old, new in [
              ('''.cyber-button,\n.cv-btn {''', '''.cyber-button {'''),
              ('''.cyber-button::before,\n.cv-btn::before {''', '''.cyber-button::before {'''),
              ('''.cyber-button:hover,\n.cyber-button:focus-visible,\n.cv-btn:hover,\n.cv-btn:focus-visible {''', '''.cyber-button:hover,\n.cyber-button:focus-visible {'''),
              ('''.cyber-button:hover::before,\n.cyber-button:focus-visible::before,\n.cv-btn:hover::before,\n.cv-btn:focus-visible::before {''', '''.cyber-button:hover::before,\n.cyber-button:focus-visible::before {'''),
              ('''.cyber-button:active,\n.cv-btn:active {''', '''.cyber-button:active {'''),
          ]:
              replace_once(css, old, new)

          test_file = "tests/build132RedesignSurface.test.mjs"
          regex_once(
              test_file,
              r'''test\("Build 132 header keeps command identity, search, clock, fullscreen, and notifications", \(\) => \{.*?\n\}\);''',
              '''test("Build 137 header keeps HUD identity, search, clock, fullscreen, and notifications", () => {\n  const header = source("src/components/Header.tsx");\n\n  for (const required of [\n    "Build 137 Cyber HUD Command Header",\n    "TAB_META",\n    "Quantum Grid Active",\n    "CinaVault B137",\n    "Hyper-Neon Fusion",\n    "setSearchQuery",\n    "toLocaleTimeString",\n    "toggleFullscreen",\n    "requestFullscreen",\n    "getUnreadStatusMessages",\n    "devicePixelRatio",\n    "requestAnimationFrame(draw)",\n  ]) {\n    assert.match(header, new RegExp(required.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&")));\n  }\n});''',
          )

          build_notes = """# CinaVault Premium Build 137 Installer Rebuild Notes\n\nBuild: 137\nDate: 2026-06-25\nBranch: main\nWorkflow: `.github/workflows/windows-installer.yml`\nExpected artifact: `CinaVault-Premium-Windows-Installer-Build137`\nRepository output folder: `releases/build-137/`\n\n## Rebuild request\n\nRebuild the Windows installer from the current `main` branch and publish the installer artifacts back into the repository under `releases/build-137/` with generated SHA256 sums and an installer upload report.\n\nThe workflow copies this file into the staged installer artifact folder as `BUILD_NOTES_PGMA.md` before upload and publication.\n\n## Required feature carry-forward\n\nPreserve the Build 137 Cyber HUD UI while carrying forward the Build 132/136 media, metadata, plugin, and installer behavior.\n\n## Metadata provider requirements\n\n- PGMA Modernized metadata provider.\n- Porn Site Nuxt metadata provider.\n- Local Nuxt endpoint default: `http://localhost:42069/`.\n- PGMA native bridge support retained.\n\n## Verification\n\n```powershell\nnpm run test:build132\nnpm run build\ncargo test -- --nocapture\ncargo check\nnpm run tauri build\n```\n\n## Artifact publication rule\n\nOnly publish real generated installer artifacts, hashes, build notes, and installer upload reports into `releases/build-137/`.\n"""
          write("releases/build-137/BUILD_NOTES_PGMA.md", build_notes)

          release_files = [
              "BUILD_NOTES_PGMA.md",
              "CinaVault Premium_1.0.137_x64_en-US.msi",
              "CinaVault Premium_1.0.137_x64-setup.exe",
              "RELEASE-NOTES.md",
          ]
          release_dir = Path("releases/build-137")
          lines = []
          for name in release_files:
              digest = hashlib.sha256((release_dir / name).read_bytes()).hexdigest().upper()
              lines.append(f"{digest}  {name}")
          write(release_dir / "SHA256SUMS.txt", "\n".join(lines) + "\n")
          PY

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-build-137-review-fixes.yml
          git add src/store/appStore.ts src/components/Header.tsx src/components/tabs/HomeTab.tsx src/styles/cyber-hud.css tests/build132RedesignSurface.test.mjs releases/build-137/BUILD_NOTES_PGMA.md releases/build-137/SHA256SUMS.txt
          git status --short
          git commit -m "Fix Build 137 review issues"
          git push origin HEAD:codex/fix-build-137-review-issues

      - name: Validate patched branch
        shell: bash
        run: |
          npm ci
          npm run test:build132
          npm run build
          if [ -f src-tauri/Cargo.toml ]; then
            cargo check --manifest-path src-tauri/Cargo.toml
          fi
