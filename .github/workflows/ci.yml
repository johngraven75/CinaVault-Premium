name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - build-169-casting
      - build-169-validation
      - build-170-remote-connectivity
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type, Test, and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee install.log

      - name: TypeScript validation
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee types.log

      - name: Carry-forward and Build 170 regression tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:all 2>&1 | tee tests.log

      - name: Production frontend build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend.log

      - name: Install Tauri Linux prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            imagemagick

      - name: Prepare cross-platform bundle resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/wireguard src-tauri/tools/wireguard src-tauri/tools/cloudflared
          if [ ! -f tools/wireguard/wireguard.exe ]; then
            printf 'CI placeholder for Windows bundle resource\n' > tools/wireguard/wireguard.exe
          fi
          if [ ! -f src-tauri/tools/wireguard/wireguard.exe ]; then
            printf 'CI placeholder for Windows bundle resource\n' > src-tauri/tools/wireguard/wireguard.exe
          fi
          if [ ! -f src-tauri/tools/cloudflared/README.txt ]; then
            printf 'CI placeholder directory for cloud relay resource\n' > src-tauri/tools/cloudflared/README.txt
          fi
          shopt -s nullglob
          for icon in src-tauri/icons/*.png; do
            converted="${icon%.png}.rgba.png"
            convert "$icon" -alpha on -define png:color-type=6 "$converted"
            mv "$converted" "$icon"
          done

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Native Rust validation
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee rust.log

      - name: Publish diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-170-validation-${{ github.sha }}
          path: |
            install.log
            types.log
            tests.log
            frontend.log
            rust.log
          if-no-files-found: warn
          retention-days: 30

      - name: Report validation result to pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "Build 170 validation completed. Review the CI job conclusion and diagnostic artifact for install, TypeScript, regression, frontend, and Rust results."

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: cinavault-frontend-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
