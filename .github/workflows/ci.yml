name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - build-169-casting
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type, Test, and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee install.log

      - name: TypeScript validation
        id: types
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee types.log

      - name: Carry-forward regression tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:all 2>&1 | tee tests.log

      - name: Production frontend build
        id: frontend
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend.log

      - name: Setup Rust
        if: steps.install.outcome == 'success'
        uses: dtolnay/rust-toolchain@stable

      - name: Native Rust validation
        id: rust
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee rust.log

      - name: Publish diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-169-validation-${{ github.sha }}
          path: |
            install.log
            types.log
            tests.log
            frontend.log
            rust.log
          if-no-files-found: warn
          retention-days: 30

      - name: Report validation result to pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          summary="Build 169 validation: install=${{ steps.install.outcome }}, types=${{ steps.types.outcome }}, tests=${{ steps.tests.outcome }}, frontend=${{ steps.frontend.outcome }}, rust=${{ steps.rust.outcome }}"
          gh pr comment "${{ github.event.pull_request.number }}" --body "$summary"

      - name: Enforce release gates
        if: always()
        shell: bash
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.types.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.frontend.outcome }}" = "success"
          test "${{ steps.rust.outcome }}" = "success"

      - name: Upload frontend build
        if: steps.frontend.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cinavault-frontend-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
