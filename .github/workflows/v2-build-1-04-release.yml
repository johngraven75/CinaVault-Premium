name: CinaVault Premium v2 Build 1.05 Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cinavault-v2-0-5-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 2.0.5
  TAG_NAME: v2.0.5
  ARTIFACT_NAME: CinaVault-Premium-Windows-v2-Build-1.05
  WIREGUARD_MSI_URL: https://download.wireguard.com/windows-client/wireguard-amd64-1.1.msi

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Verify release identity
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargoVersion = ((Get-Content src-tauri/Cargo.toml | Select-String '^version = ' | Select-Object -First 1).Line -replace 'version = ', '').Trim('"')
          if ($packageVersion -ne $env:APP_VERSION) { throw "package.json version mismatch: $packageVersion" }
          if ($tauri.version -ne $env:APP_VERSION) { throw "tauri version mismatch: $($tauri.version)" }
          if ($cargoVersion -ne $env:APP_VERSION) { throw "cargo version mismatch: $cargoVersion" }

      - name: Master candidate gate
        run: npm run verify:master-build

      - name: Shared contract conformance gate
        run: npm run verify:contracts

      - name: Preventive risk gate
        run: npm run scan:preventive

      - name: Frontend validation
        run: |
          npm run lint
          npm test
          npm run build

      - name: Prepare genuine Windows bundle resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Invoke-WebRequest -Uri $env:WIREGUARD_MSI_URL -OutFile wireguard-amd64.msi
          $msiSignature = Get-AuthenticodeSignature .\wireguard-amd64.msi
          if ($msiSignature.Status -ne 'Valid') { throw "WireGuard MSI signature is not valid: $($msiSignature.Status)" }

          New-Item -ItemType Directory -Path wireguard-extracted -Force | Out-Null
          $target = (Resolve-Path .\wireguard-extracted).Path
          $process = Start-Process msiexec.exe -ArgumentList @('/a', (Resolve-Path .\wireguard-amd64.msi).Path, '/qn', "TARGETDIR=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "WireGuard extraction failed with exit code $($process.ExitCode)" }

          $wireGuard = Get-ChildItem wireguard-extracted -Recurse -File -Filter wireguard.exe | Select-Object -First 1
          if (-not $wireGuard) { throw 'wireguard.exe was not found in the official MSI.' }
          $wireGuardSignature = Get-AuthenticodeSignature $wireGuard.FullName
          if ($wireGuardSignature.Status -ne 'Valid') { throw "WireGuard executable signature is not valid: $($wireGuardSignature.Status)" }
          New-Item -ItemType Directory -Path src-tauri\tools\wireguard -Force | Out-Null
          Copy-Item $wireGuard.FullName src-tauri\tools\wireguard\wireguard.exe -Force

          New-Item -ItemType Directory -Path src-tauri\tools\cloudflared -Force | Out-Null
          $cloudflaredUrl = 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe'
          Invoke-WebRequest -Uri $cloudflaredUrl -OutFile src-tauri\tools\cloudflared\cloudflared.exe
          $cloudflared = Get-Item src-tauri\tools\cloudflared\cloudflared.exe
          if ($cloudflared.Length -lt 10000000) { throw "Downloaded cloudflared binary is unexpectedly small: $($cloudflared.Length) bytes" }

          Write-Host "WireGuard SHA256: $((Get-FileHash src-tauri\tools\wireguard\wireguard.exe -Algorithm SHA256).Hash)"
          Write-Host "cloudflared SHA256: $((Get-FileHash $cloudflared.FullName -Algorithm SHA256).Hash)"

      - name: Rust validation
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
          cargo check --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc

      - name: Live metadata and poster acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --manifest-path src-tauri/Cargo.toml live_tvmaze_metadata_poster_acceptance -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Live metadata/poster acceptance failed with exit code $LASTEXITCODE" }

      - name: Build Windows installers
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Stage and checksum installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path installer-staging -Force | Out-Null
          Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination installer-staging -Force
          $msi = @(Get-ChildItem installer-staging -File -Filter *.msi)
          $exe = @(Get-ChildItem installer-staging -File -Filter *.exe)
          if ($msi.Count -lt 1) { throw 'No MSI installer was produced.' }
          if ($exe.Count -lt 1) { throw 'No NSIS EXE installer was produced.' }
          $files = Get-ChildItem installer-staging -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          $checksums = foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)"
          }
          Set-Content installer-staging\SHA256SUMS.txt $checksums -Encoding utf8

      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: installer-staging/
          if-no-files-found: error
          retention-days: 30

      - name: Publish v2.0.5 GitHub release
        if: github.event_name != 'pull_request' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: main
          name: CinaVault Premium v2 Build 1.05
          body: |
            CinaVault Premium v2 Build 1.05, version 2.0.5.
            Published only after candidate gate, contract checks, preventive scan, frontend validation, genuine bundle-resource staging, Rust validation, live metadata/poster acceptance, and verified Windows MSI/NSIS packaging passed in this workflow run.
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installer-staging/*.msi
            installer-staging/*.exe
            installer-staging/SHA256SUMS.txt