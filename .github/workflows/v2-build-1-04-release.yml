name: CinaVault Premium v2.08 Build 1.09 Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cinavault-v2-08-build-1-09-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 2.0.8
  TAG_NAME: v2-build-1.09
  ARTIFACT_NAME: CinaVault-Premium-Windows-v2.08-Build-1.09
  TEST_ARTIFACT_NAME: CinaVault-Premium-v2.08-Build-1.09-Test-Notes
  WIREGUARD_MSI_URL: https://download.wireguard.com/windows-client/wireguard-amd64-1.1.msi

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Initialize evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-evidence,installer-staging -Force | Out-Null
          @"
          # CinaVault Premium v2.08 Build 1.09
          - Commit: $env:GITHUB_SHA
          - Event: $env:GITHUB_EVENT_NAME
          - Started UTC: $([DateTime]::UtcNow.ToString('o'))
          "@ | Set-Content test-evidence/TEST-NOTES.md -Encoding utf8

      - name: Install dependencies
        run: npm ci

      - name: Verify release identity
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $manifest = Get-Content build-version.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($packageVersion -ne $env:APP_VERSION) { throw "package version mismatch: $packageVersion" }
          if ($manifest.semanticVersion -ne $env:APP_VERSION) { throw "manifest version mismatch" }
          if ($manifest.displayBuild -ne '1.09') { throw "display build mismatch: $($manifest.displayBuild)" }
          if ($manifest.displayName -ne 'v2.08 Build 1.09') { throw "display name mismatch" }
          if ($manifest.releaseTag -ne $env:TAG_NAME) { throw "release tag mismatch: $($manifest.releaseTag)" }
          if ($tauri.version -ne $env:APP_VERSION) { throw "tauri version mismatch" }
          '- Release identity: PASS' | Add-Content test-evidence/TEST-NOTES.md

      - name: Ensure release tag is unused
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/$env:TAG_NAME" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release tag $env:TAG_NAME already exists." }
          exit 0

      - name: Frontend, contracts, and preventive validation
        shell: pwsh
        run: |
          npm run verify:contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run scan:preventive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '- Frontend and governance: PASS' | Add-Content test-evidence/TEST-NOTES.md

      - name: Prepare bundled WireGuard and Cloudflared
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:WIREGUARD_MSI_URL -OutFile wireguard-amd64.msi
          if ((Get-AuthenticodeSignature .\wireguard-amd64.msi).Status -ne 'Valid') { throw 'WireGuard MSI signature is invalid.' }
          New-Item -ItemType Directory -Path wireguard-extracted -Force | Out-Null
          $target = (Resolve-Path .\wireguard-extracted).Path
          $process = Start-Process msiexec.exe -ArgumentList @('/a',(Resolve-Path .\wireguard-amd64.msi).Path,'/qn',"TARGETDIR=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "WireGuard extraction failed: $($process.ExitCode)" }
          $wireGuard = Get-ChildItem wireguard-extracted -Recurse -File -Filter wireguard.exe | Select-Object -First 1
          if (-not $wireGuard) { throw 'wireguard.exe was not found.' }
          New-Item -ItemType Directory -Path src-tauri\tools\wireguard -Force | Out-Null
          Copy-Item $wireGuard.FullName src-tauri\tools\wireguard\wireguard.exe -Force
          New-Item -ItemType Directory -Path src-tauri\tools\cloudflared -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile src-tauri\tools\cloudflared\cloudflared.exe
          if ((Get-Item src-tauri\tools\cloudflared\cloudflared.exe).Length -lt 10000000) { throw 'cloudflared binary is unexpectedly small.' }
          '- Bundle resources: PASS' | Add-Content test-evidence/TEST-NOTES.md

      - name: Rust validation
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '- Rust validation: PASS' | Add-Content test-evidence/TEST-NOTES.md

      - name: Build and stage Windows installers
        shell: pwsh
        run: |
          npm run tauri build -- --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi','.exe' } | Copy-Item -Destination installer-staging -Force
          if (@(Get-ChildItem installer-staging -Filter *.msi).Count -lt 1) { throw 'No MSI produced.' }
          if (@(Get-ChildItem installer-staging -Filter *.exe).Count -lt 1) { throw 'No NSIS EXE produced.' }
          Get-ChildItem installer-staging -File | ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" } | Set-Content installer-staging/SHA256SUMS.txt
          Copy-Item installer-staging/SHA256SUMS.txt test-evidence/INSTALLER-SHA256SUMS.txt
          "- Installer build: PASS`n- Completed UTC: $([DateTime]::UtcNow.ToString('o'))" | Add-Content test-evidence/TEST-NOTES.md
          Compress-Archive -Path test-evidence/* -DestinationPath installer-staging/CinaVault-Premium-v2.08-Build-1.09-Test-Notes.zip -Force

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST_ARTIFACT_NAME }}
          path: test-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Upload verified installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: installer-staging/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Build 1.09 release
        if: github.event_name != 'pull_request' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: main
          name: CinaVault Premium v2.08 Build 1.09
          body_path: test-evidence/TEST-NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installer-staging/*.msi
            installer-staging/*.exe
            installer-staging/SHA256SUMS.txt
            installer-staging/CinaVault-Premium-v2.08-Build-1.09-Test-Notes.zip
