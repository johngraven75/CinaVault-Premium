# CinaVault Premium v1.0.2 Pre-Beta Build 102 release: library engine, holo UI,
# holographic AI agent, offline vision model, no paywall. Signs when configured.
name: CinaVault Premium v1.0.2 Pre-Beta Release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-triggers/v1.0.2-pre-beta"
      - ".github/workflows/v2-build-1-04-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cinavault-v1-0-2-pre-beta-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.2
  TAG_NAME: v1.0.2-pre-beta
  DISPLAY_NAME: v1.0.2 Pre-Beta Build 102
  ARTIFACT_NAME: CinaVault-Premium-Windows-v1.0.2-Pre-Beta
  TEST_ARTIFACT_NAME: CinaVault-Premium-v1.0.2-Pre-Beta-Test-Notes
  WIREGUARD_MSI_URL: https://download.wireguard.com/windows-client/wireguard-amd64-1.1.msi

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Clear stale generated work
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist,installer-staging,test-evidence,release-diagnostics -ErrorAction SilentlyContinue

      - name: Initialize build evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-evidence,release-diagnostics -Force | Out-Null
          @"
          # CinaVault Premium Build Test Notes

          - Public release: v1.0.2 Pre-Beta
          - Build: 102
          - Internal version: 1.0.2
          - Commit: $env:GITHUB_SHA
          - Event: $env:GITHUB_EVENT_NAME
          - Started (UTC): $([DateTime]::UtcNow.ToString('o'))

          ## Required validation
          This build must pass release identity, master candidate, shared contracts,
          preventive risk scan, TypeScript, frontend tests, frontend production build,
          Rust formatting/tests/check, live metadata/poster acceptance, and Windows packaging.
          "@ | Set-Content test-evidence/TEST-NOTES.md -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci 2>&1 | Tee-Object test-evidence/npm-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release identity
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $manifest = Get-Content build-version.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargoVersion = ((Get-Content src-tauri/Cargo.toml | Select-String '^version = ' | Select-Object -First 1).Line -replace 'version = ', '').Trim('"')
          if ($packageVersion -ne $env:APP_VERSION) { throw "package.json version mismatch: $packageVersion" }
          if ($manifest.semanticVersion -ne $env:APP_VERSION) { throw "build manifest mismatch: $($manifest.semanticVersion)" }
          if ($manifest.displayBuild -ne '102') { throw "display build mismatch: $($manifest.displayBuild)" }
          if ($manifest.displayName -ne $env:DISPLAY_NAME) { throw "display name mismatch: $($manifest.displayName)" }
          if ($manifest.releaseTag -ne $env:TAG_NAME) { throw "release tag format mismatch: $($manifest.releaseTag)" }
          if ($tauri.version -ne $env:APP_VERSION) { throw "tauri version mismatch: $($tauri.version)" }
          if ($cargoVersion -ne $env:APP_VERSION) { throw "cargo version mismatch: $cargoVersion" }
          "- Release identity: PASS" | Add-Content test-evidence/TEST-NOTES.md

      - name: Protect immutable release tag
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $remoteTag = git ls-remote --exit-code --tags origin "refs/tags/$env:TAG_NAME^{}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $tagSha = ($remoteTag -split "\t")[0]
            if ($tagSha -ne $env:GITHUB_SHA) { throw "Release tag $env:TAG_NAME already exists on a different commit: $tagSha" }
          }
          exit 0

      - name: Master candidate gate
        shell: pwsh
        run: |
          npm run verify:master-build 2>&1 | Tee-Object test-evidence/master-candidate.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "- Master candidate gate: PASS" | Add-Content test-evidence/TEST-NOTES.md

      - name: Shared contract conformance gate
        shell: pwsh
        run: |
          npm run verify:contracts 2>&1 | Tee-Object test-evidence/shared-contracts.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "- Shared contracts: PASS" | Add-Content test-evidence/TEST-NOTES.md

      - name: Preventive risk gate
        shell: pwsh
        run: |
          npm run scan:preventive 2>&1 | Tee-Object test-evidence/preventive-risk.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "- Preventive risk scan: PASS" | Add-Content test-evidence/TEST-NOTES.md

      - name: Bundle and verify offline vision model
        # Pinned, digest-checked CLIP weights go into the installer; the model
        # is then run with no network access before anything is built.
        shell: pwsh
        run: |
          npm run fetch:ai-models 2>&1 | Tee-Object test-evidence/vision-model-fetch.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:vision-e2e 2>&1 | Tee-Object test-evidence/vision-model-e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "- Offline vision model end to end: PASS" | Add-Content test-evidence/TEST-NOTES.md

      - name: Frontend validation
        shell: pwsh
        run: |
          npm run lint 2>&1 | Tee-Object test-evidence/typescript.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test 2>&1 | Tee-Object test-evidence/frontend-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --loader ./tests/typescript-loader.mjs --test --test-concurrency=1 tests/*.test.mjs 2>&1 | Tee-Object test-evidence/complete-node-suite.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/huggingFaceModelSelection.test.mjs tests/libraryLoadPolicy.test.mjs tests/metadataTaskProgress.test.mjs tests/build165PluginProviderConfig.test.mjs tests/adultMediaIsolation.test.mjs tests/v2Build110RuntimeRepairs.test.mjs tests/v2Build111AdultLibraryAndHfTab.test.mjs 2>&1 | Tee-Object test-evidence/carry-forward-feature-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build 2>&1 | Tee-Object test-evidence/frontend-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "- TypeScript and frontend validation: PASS" | Add-Content test-evidence/TEST-NOTES.md

      - name: Prepare genuine Windows bundle resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:WIREGUARD_MSI_URL -OutFile wireguard-amd64.msi
          $msiSignature = Get-AuthenticodeSignature .\wireguard-amd64.msi
          if ($msiSignature.Status -ne 'Valid') { throw "WireGuard MSI signature is not valid: $($msiSignature.Status)" }
          New-Item -ItemType Directory -Path wireguard-extracted -Force | Out-Null
          $target = (Resolve-Path .\wireguard-extracted).Path
          $process = Start-Process msiexec.exe -ArgumentList @('/a', (Resolve-Path .\wireguard-amd64.msi).Path, '/qn', "TARGETDIR=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "WireGuard extraction failed: $($process.ExitCode)" }
          $wireGuard = Get-ChildItem wireguard-extracted -Recurse -File -Filter wireguard.exe | Select-Object -First 1
          if (-not $wireGuard) { throw 'wireguard.exe was not found.' }
          New-Item -ItemType Directory -Path src-tauri\tools\wireguard -Force | Out-Null
          Copy-Item $wireGuard.FullName src-tauri\tools\wireguard\wireguard.exe -Force
          New-Item -ItemType Directory -Path src-tauri\tools\cloudflared -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile src-tauri\tools\cloudflared\cloudflared.exe
          if ((Get-Item src-tauri\tools\cloudflared\cloudflared.exe).Length -lt 10000000) { throw 'cloudflared binary is unexpectedly small.' }
          "- Genuine bundle resources: PASS" | Add-Content test-evidence/TEST-NOTES.md

      - name: Rust validation
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 | Tee-Object test-evidence/rust-format.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked 2>&1 | Tee-Object test-evidence/rust-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc 2>&1 | Tee-Object test-evidence/rust-check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "- Rust validation: PASS" | Add-Content test-evidence/TEST-NOTES.md

      - name: Live TV and movie metadata, poster, and database acceptance
        shell: pwsh
        run: |
          cmd /d /s /c "npm run test:metadata-live > release-diagnostics\live-metadata.log 2>&1"
          $exitCode = $LASTEXITCODE
          Copy-Item release-diagnostics/live-metadata.log test-evidence/live-metadata.log -Force
          $log = Get-Content release-diagnostics/live-metadata.log -Raw
          Write-Host $log
          if ($exitCode -ne 0) { throw "Live metadata/poster acceptance failed: $exitCode" }
          if ($log -notmatch 'live_metadata_poster_acceptance_tvmaze_series') { throw 'TVMaze test did not execute.' }
          if ($log -notmatch 'live_metadata_poster_acceptance_cinemeta_movie') { throw 'Cinemeta test did not execute.' }
          if ($log -notmatch 'test result: ok\. 2 passed; 0 failed') { throw 'Live metadata gate did not report exactly two passing acceptance tests.' }
          "- Live metadata and poster acceptance: PASS" | Add-Content test-evidence/TEST-NOTES.md

      - name: Configure code signing
        # Azure Artifact Signing (docs/CODE_SIGNING.md). Without the settings
        # the installers are built unsigned and the run shows a warning.
        id: signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          ./scripts/configure-windows-signing.ps1 -ConfigPath "$env:RUNNER_TEMP\cinavault-signing.tauri.json"

      - name: Install Artifact Signing CLI
        if: steps.signing.outputs.enabled == 'true'
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      - name: Build Windows installers
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $signing = @()
          if ($env:CINAVAULT_SIGNING_CONFIG) { $signing = @('--config', $env:CINAVAULT_SIGNING_CONFIG) }
          # Call the Tauri CLI directly so the arguments reach it unchanged.
          npx --no-install tauri build --target x86_64-pc-windows-msvc @signing 2>&1 | Tee-Object test-evidence/windows-build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            # Job logs are not always reachable, so surface the end of the build log as an annotation.
            $tail = (Get-Content test-evidence/windows-build.log -Tail 40) -join '%0A'
            Write-Host "::error title=Windows installer build failed (exit $buildExit)::$tail"
            exit $buildExit
          }
          "- Windows MSI and NSIS build: PASS" | Add-Content test-evidence/TEST-NOTES.md
          $signingNote = if ($env:CINAVAULT_SIGNING_CONFIG) { "- Code signing: signed" } else { "- Code signing: NOT SIGNED (signing not configured)" }
          $signingNote | Add-Content test-evidence/TEST-NOTES.md

      - name: Verify installer signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1 -Root 'src-tauri\target\x86_64-pc-windows-msvc\release'

      - name: Stage installers and finalize test notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path installer-staging -Force | Out-Null
          Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } | Copy-Item -Destination installer-staging -Force
          if (@(Get-ChildItem installer-staging -Filter *.msi).Count -lt 1) { throw 'No MSI produced.' }
          if (@(Get-ChildItem installer-staging -Filter *.exe).Count -lt 1) { throw 'No NSIS EXE produced.' }
          $checksums = Get-ChildItem installer-staging -File | ForEach-Object { "$(Get-FileHash $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($_.Name)" }
          Set-Content installer-staging/SHA256SUMS.txt $checksums -Encoding utf8
          Copy-Item installer-staging/SHA256SUMS.txt test-evidence/INSTALLER-SHA256SUMS.txt
          "`n## Final result`n- Completed (UTC): $([DateTime]::UtcNow.ToString('o'))`n- All required tests: PASS`n- Packaging: PASS" | Add-Content test-evidence/TEST-NOTES.md
          Compress-Archive -Path test-evidence/* -DestinationPath installer-staging/CinaVault-Premium-v1.0.2-Pre-Beta-Test-Notes.zip -Force

      - name: Record failure in test notes
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-evidence -Force | Out-Null
          if (-not (Test-Path test-evidence/TEST-NOTES.md)) { '# CinaVault Premium Build Test Notes' | Set-Content test-evidence/TEST-NOTES.md }
          "`n## Final result`n- Completed (UTC): $([DateTime]::UtcNow.ToString('o'))`n- Workflow result: FAILED`n- Review the attached logs and failed GitHub Actions step." | Add-Content test-evidence/TEST-NOTES.md

      - name: Master release authorization gate
        shell: pwsh
        run: |
          npm run verify:master-release 2>&1 | Tee-Object test-evidence/master-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "- Master release authorization: PASS" | Add-Content test-evidence/TEST-NOTES.md

      - name: Upload test notes for every build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.TEST_ARTIFACT_NAME }}
          path: test-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Upload verified installers
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: installer-staging/
          if-no-files-found: error
          retention-days: 30

      - name: Publish v1.0.2 Pre-Beta Build 102 GitHub release
        if: github.event_name != 'pull_request' && success()
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: main
          name: CinaVault Premium v1.0.2 Pre-Beta Build 102
          body_path: test-evidence/TEST-NOTES.md
          draft: false
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installer-staging/*.msi
            installer-staging/*.exe
            installer-staging/SHA256SUMS.txt
            installer-staging/CinaVault-Premium-v1.0.2-Pre-Beta-Test-Notes.zip
