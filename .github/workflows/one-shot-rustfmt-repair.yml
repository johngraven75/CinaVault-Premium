name: One-shot Rustfmt Repair

on:
  push:
    branches:
      - fix/external-scan-posters-card-layout
    paths:
      - .github/workflows/one-shot-rustfmt-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-rustfmt-repair
  cancel-in-progress: false

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/external-scan-posters-card-layout
          fetch-depth: 0

      - name: Install canonical Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Rust sources already match canonical rustfmt output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "style(rust): apply canonical cargo fmt"
          git push origin HEAD:fix/external-scan-posters-card-layout
