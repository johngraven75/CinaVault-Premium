name: Build 170 Publish

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write

concurrency:
  group: build-170-release
  cancel-in-progress: false

env:
  RELEASE_MONITOR_ISSUE: "49"

jobs:
  authorize:
    name: Authorize Build 170 release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 49 &&
       github.event.comment.body == '/release build-170' &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.authorization.outputs.allowed }}
    steps:
      - name: Authorize owner release command
        id: authorization
        shell: bash
        run: echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Register release run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.RELEASE_MONITOR_ISSUE),
              body: `Build 170 release run started: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCommit: ${context.sha}`
            });

  validate:
    name: Build 170 regression gate
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Carry-forward and Build 170 regression tests
        run: npm run test:all

      - name: Production frontend build
        run: npm run build

  windows-installers:
    name: Build 170 MSI and NSIS
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare genuine Windows bundle resources
        shell: pwsh
        run: |
          choco install wireguard -y --no-progress
          $wireGuardCandidates = @(
            'C:\Program Files\WireGuard\wireguard.exe',
            'C:\Program Files (x86)\WireGuard\wireguard.exe'
          )
          $wireGuardSource = $wireGuardCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wireGuardSource) {
            $wireGuardSource = Get-ChildItem 'C:\Program Files*' -Filter wireguard.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $wireGuardSource) {
            throw 'A genuine WireGuard executable could not be located after installation.'
          }
          New-Item -ItemType Directory -Force -Path src-tauri/tools/wireguard | Out-Null
          Copy-Item $wireGuardSource src-tauri/tools/wireguard/wireguard.exe -Force

          New-Item -ItemType Directory -Force -Path src-tauri/tools/cloudflared | Out-Null
          $cloudflaredUrl = 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe'
          Invoke-WebRequest -Uri $cloudflaredUrl -OutFile src-tauri/tools/cloudflared/cloudflared.exe
          $cloudflared = Get-Item src-tauri/tools/cloudflared/cloudflared.exe
          if ($cloudflared.Length -lt 10000000) {
            throw "Downloaded cloudflared binary is unexpectedly small: $($cloudflared.Length) bytes"
          }
          $cloudflaredHash = (Get-FileHash $cloudflared.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "cloudflared_sha256=$cloudflaredHash" >> $env:GITHUB_ENV
          "cloudflared_size=$($cloudflared.Length)" >> $env:GITHUB_ENV

          Add-Type -AssemblyName System.Drawing
          Get-ChildItem src-tauri/icons -Filter *.png | ForEach-Object {
            $sourcePath = $_.FullName
            $temporaryPath = "$sourcePath.rgba.png"
            $sourceImage = [System.Drawing.Image]::FromFile($sourcePath)
            try {
              $bitmap = New-Object System.Drawing.Bitmap($sourceImage.Width, $sourceImage.Height, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              try {
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                try {
                  $graphics.DrawImage($sourceImage, 0, 0, $sourceImage.Width, $sourceImage.Height)
                } finally {
                  $graphics.Dispose()
                }
                $bitmap.Save($temporaryPath, [System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                $bitmap.Dispose()
              }
            } finally {
              $sourceImage.Dispose()
            }
            Move-Item $temporaryPath $sourcePath -Force
          }

      - name: Native Rust validation
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri installers
        run: npm run tauri build

      - name: Collect and verify installer artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination release-assets

          $installers = Get-ChildItem release-assets -File
          $msi = $installers | Where-Object { $_.Extension -eq '.msi' } | Select-Object -First 1
          $nsis = $installers | Where-Object { $_.Extension -eq '.exe' } | Select-Object -First 1
          if (-not $msi) { throw 'The Build 170 MSI installer was not produced.' }
          if (-not $nsis) { throw 'The Build 170 NSIS installer was not produced.' }
          if ($msi.Length -lt 1000000) { throw 'The MSI installer is unexpectedly small.' }
          if ($nsis.Length -lt 1000000) { throw 'The NSIS installer is unexpectedly small.' }

          $msiHash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $nsisHash = (Get-FileHash $nsis.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            '# CinaVault Premium Build 170',
            '',
            "MSI: $($msi.Name)",
            "MSI bytes: $($msi.Length)",
            "MSI SHA-256: $msiHash",
            '',
            "NSIS: $($nsis.Name)",
            "NSIS bytes: $($nsis.Length)",
            "NSIS SHA-256: $nsisHash",
            '',
            "cloudflared bytes: $env:cloudflared_size",
            "cloudflared SHA-256: $env:cloudflared_sha256"
          ) | Set-Content release-assets/BUILD-170-CHECKSUMS.txt

      - name: Upload Build 170 installers
        uses: actions/upload-artifact@v4
        with:
          name: cinavault-build-170-windows-installers-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Build 170 GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-170
          target_commitish: ${{ github.sha }}
          name: CinaVault Premium Build 170
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

  report-success:
    name: Report Build 170 success
    needs: windows-installers
    runs-on: ubuntu-latest
    steps:
      - name: Post verified release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.RELEASE_MONITOR_ISSUE),
              body: `Build 170 release workflow succeeded.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nRelease: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/tag/build-170`
            });

  report-failure:
    name: Report Build 170 failure
    needs:
      - authorize
      - validate
      - windows-installers
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failed run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.RELEASE_MONITOR_ISSUE),
              body: `Build 170 release workflow failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}`
            });
