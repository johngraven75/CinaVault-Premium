name: Release Build 167 Beta 1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-build-167-beta-1.yml'
      - '.github/release-triggers/build-167-beta-1.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-167-beta-1
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build and publish Windows prerelease
