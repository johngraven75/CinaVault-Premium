name: LumaSift Build 171 Windows Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "RELEASE_NOTES_BUILD171.md"
      - ".github/workflows/lumasift-build171-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumasift-build-171-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_VERSION: "2.0.14"
  RELEASE_TAG: "build-171"
  ARTIFACT_NAME: "LumaSift-Build171-Windows"

jobs:
  validate-package-publish:
    name: Validate, package, and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Build 171 identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = ((Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version)
          $cargoVersion = ((Get-Content src-tauri/Cargo.toml | Select-String '^version = ' | Select-Object -First 1).Line -replace 'version = ', '').Trim('"')
          if ($packageVersion -ne $env:APP_VERSION) { throw "package.json version is $packageVersion, expected $env:APP_VERSION" }
          if ($tauriVersion -ne $env:APP_VERSION) { throw "tauri.conf.json version is $tauriVersion, expected $env:APP_VERSION" }
          if ($cargoVersion -ne $env:APP_VERSION) { throw "Cargo.toml version is $cargoVersion, expected $env:APP_VERSION" }
          if (-not (Test-Path RELEASE_NOTES_BUILD171.md)) { throw 'Build 171 release notes are missing.' }

      - name: Prepare required WireGuard runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install wireguard -y --no-progress
          $source = @('C:\Program Files\WireGuard\wireguard.exe', 'C:\Program Files (x86)\WireGuard\wireguard.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $source) { throw 'WireGuard executable could not be located after installation.' }
          New-Item -ItemType Directory -Force -Path src-tauri/tools/wireguard | Out-Null
          Copy-Item $source src-tauri/tools/wireguard/wireguard.exe -Force

      - name: Run frontend, contract, and regression checks
        run: |
          npm run lint
          npm run test:all
          npm run build

      - name: Run Rust formatting and compile checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc

      - name: Build MSI and NSIS installers
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Stage and checksum installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination release-assets -Force
          $msi = @(Get-ChildItem release-assets -File -Filter *.msi)
          $exe = @(Get-ChildItem release-assets -File -Filter *.exe)
          if ($msi.Count -lt 1 -or $exe.Count -lt 1) { throw 'Both MSI and NSIS installer artifacts are required.' }
          $entries = Get-ChildItem release-assets -File | Where-Object { $_.Extension -in '.msi', '.exe' } | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)"
          }
          Set-Content release-assets/SHA256SUMS.txt $entries -Encoding utf8

      - name: Upload validated installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish Build 171 Windows release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "CinaVault Premium — LumaSift Build 171"
          body_path: RELEASE_NOTES_BUILD171.md
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.msi
            release-assets/*.exe
            release-assets/SHA256SUMS.txt
