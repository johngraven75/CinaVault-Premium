name: Auto Build, Test, Cleanup & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Windows Installers
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Regression test suite
        run: npm test

      - name: Live metadata and poster acceptance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path validation-logs -Force | Out-Null
          cmd /d /s /c "npm run test:metadata-live > validation-logs\live-metadata.log 2>&1"
          $exitCode = $LASTEXITCODE
          $log = Get-Content validation-logs/live-metadata.log -Raw
          Write-Host $log
          if ($exitCode -ne 0) { throw "Live metadata acceptance failed: $exitCode" }
          if ($log -notmatch 'live_metadata_poster_acceptance_tvmaze_series') { throw 'TVMaze series acceptance test did not execute.' }
          if ($log -notmatch 'live_metadata_poster_acceptance_cinemeta_movie') { throw 'Cinemeta movie acceptance test did not execute.' }
          if ($log -notmatch 'test result: ok\. 2 passed; 0 failed') { throw 'Live metadata gate did not report exactly two passing acceptance tests.' }

      - name: Master release authorization gate
        run: npm run verify:master-release

      - name: Bundle local AI vision model
        # CLIP weights ship inside the installer so poster/film identification
        # works at first launch with no download or token (docs/LOCAL_AI.md).
        run: npm run fetch:ai-models

      - name: Build frontend
        run: npm run build

      - name: Configure code signing
        # Azure Artifact Signing (docs/CODE_SIGNING.md). Secrets are passed as
        # env because they cannot be read in an `if:`; when any is missing the
        # build stays unsigned and the run shows a warning.
        id: signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: ./scripts/configure-windows-signing.ps1 -ConfigPath "$env:RUNNER_TEMP\cinavault-signing.tauri.json"

      - name: Install Artifact Signing CLI
        if: steps.signing.outputs.enabled == 'true'
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      - name: Build Windows Installers
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $signing = @()
          if ($env:CINAVAULT_SIGNING_CONFIG) { $signing = @('--config', $env:CINAVAULT_SIGNING_CONFIG) }
          npm run tauri build -- --target x86_64-pc-windows-msvc @signing
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed: $LASTEXITCODE" }

      - name: Verify installer signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1 -Root 'src-tauri\target\x86_64-pc-windows-msvc\release'

      - name: Stage Installers and Generate Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path installer-staging -Force | Out-Null
          Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination installer-staging -Force

          $files = Get-ChildItem installer-staging -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          if ($files.Count -eq 0) {
            throw "No installer binaries (.exe or .msi) were found after build."
          }

          $checksums = foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)"
          }
          Set-Content -Path installer-staging\SHA256SUMS.txt -Value $checksums -Encoding utf8

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-Premium-Windows-Installers
          path: installer-staging/
          if-no-files-found: error
          retention-days: 15

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            installer-staging/*.msi
            installer-staging/*.exe
            installer-staging/SHA256SUMS.txt
