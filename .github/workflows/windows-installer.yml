name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/cinavault-pgma-plex-plugin
      - codex/cyber-hud-build-137
    paths-ignore:
      - 'releases/**'
      - 'package-lock.json'

permissions:
  contents: write

env:
  BUILD_NUMBER: '140'
  BUILD_OUTPUT_DIR: releases/build-140
  INSTALLER_ARTIFACT_NAME: CinaVault-Premium-Windows-Installer-Build140
  BUILD_TRIGGER: manual-2026-06-27-build-140-release

jobs:
  build-windows-installer:
    name: Build CinaVault Premium Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh npm lockfile
        shell: pwsh
        run: |
          $branch = $env:GITHUB_REF_NAME
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin $branch
          git pull --rebase --autostash origin $branch

          npm install --package-lock-only

          git add package.json package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Refresh npm lockfile for Build ${{ env.BUILD_NUMBER }}'
            git push origin HEAD:$branch
          } else {
            Write-Host 'No package lock refresh needed.'
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build installer with one-step PowerShell script
        shell: pwsh
        working-directory: ./
        run: .\scripts\build-installer.ps1 -NoDesktopCopy -NoOpenDesktop

      - name: Stage installer artifacts and hashes
        shell: pwsh
        run: |
          $artifact = 'artifact'
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null

          $bundle = 'src-tauri\target\release\bundle'
          if (-not (Test-Path $bundle)) {
            throw "Installer bundle directory not found: $bundle"
          }

          Get-ChildItem -Path $bundle -Recurse -File -Include *.exe,*.msi,*.zip |
            Copy-Item -Destination $artifact -Force

          if (Test-Path 'BUILD_NOTES_PGMA.md') {
            Copy-Item 'BUILD_NOTES_PGMA.md' "$artifact\BUILD_NOTES_PGMA.md" -Force
          }

          @(
            '# CinaVault Premium Build ${{ env.BUILD_NUMBER }} Notes',
            '',
            'Build: ${{ env.BUILD_NUMBER }}',
            "Source commit: $env:GITHUB_SHA",
            "Workflow run: $env:GITHUB_RUN_ID",
            'Artifact name: ${{ env.INSTALLER_ARTIFACT_NAME }}',
            '',
            'Carries forward the Build 137 Cyber HUD redesign, the Build 139 scanner/metadata repair validation set, and publishes the Build 140 release package.',
            '',
            'Build 140 highlights:',
            '- Publishes CinaVault Premium v1.0.140 / Build 140 from the current main branch.',
            '- Keeps the Hyper-Neon Fusion Cyber HUD, Quantum Grid navigation, holographic cards, quick stats, and terminal panel experience from Build 137.',
            '- Carries forward always-visible per-media Check Metadata actions on library cards and list/table surfaces.',
            '- Carries forward the bulk Post Metadata & Posters action through the same backend writer as the row-level Check Metadata action.',
            '- Continues scanning all enabled media sources even when one source is missing or fails.',
            '- Reports per-source scan counts, skipped disabled sources, failed sources, and ingestion errors instead of silently swallowing library upsert failures.',
            '- Sets source item counts from files found, not only newly added files, so rescans no longer zero out source counts.',
            '- Requires scanner ingestion tests plus metadata/poster posting validation before installer creation.',
            '- Publishes Windows NSIS setup EXE, MSI, release notes, build notes, and SHA256 manifest.'
          ) | Set-Content -Path "$artifact\RELEASE-NOTES.md" -Encoding UTF8

          $files = Get-ChildItem -Path $artifact -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
          if (-not $files) {
            throw 'No installer artifacts were staged.'
          }

          $hashLines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $file.FullName
            "$($hash.Hash)  $($file.Name)"
          }
          $hashLines | Set-Content -Path "$artifact\SHA256SUMS.txt" -Encoding UTF8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INSTALLER_ARTIFACT_NAME }}
          path: artifact/*
          if-no-files-found: error

      - name: Publish release folder to branch
        shell: pwsh
        run: |
          $branch = $env:GITHUB_REF_NAME
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin $branch
          git pull --rebase --autostash origin $branch

          New-Item -ItemType Directory -Path "${{ env.BUILD_OUTPUT_DIR }}" -Force | Out-Null
          Copy-Item artifact\* "${{ env.BUILD_OUTPUT_DIR }}" -Force
          git add "${{ env.BUILD_OUTPUT_DIR }}"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Publish Windows installer artifacts for Build ${{ env.BUILD_NUMBER }}'
            git push origin HEAD:$branch
          } else {
            Write-Host 'No installer artifact changes to publish.'
          }
