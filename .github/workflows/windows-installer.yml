name: CinaVault Premium — Windows Installer (Auto Build & Release)

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - ".github/workflows/apisec-scan.yml"
      - ".github/workflows/ethicalcheck.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force a GitHub release even if not on main"
        required: false
        default: "false"
      build_number_override:
        description: "Override build number (leave blank for auto)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: stable

jobs:
  validate:
    name: Validate (TS + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: TypeScript type-check & build
        run: npm run build
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Run all Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture 2>&1 || true
      - name: npm security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  build-windows:
    name: Build Windows Installer
    needs: validate
    runs-on: windows-latest
    outputs:
      build_number: ${{ steps.set_build.outputs.build_number }}
      installer_name: ${{ steps.set_build.outputs.installer_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set build number
        id: set_build
        shell: pwsh
        run: |
          $bn = if ('${{ github.event.inputs.build_number_override }}') { '${{ github.event.inputs.build_number_override }}' } else { '${{ github.run_number }}' }
          echo "build_number=$bn" >> $env:GITHUB_OUTPUT
          echo "installer_name=CinaVault-Premium-Windows-Build-$bn" >> $env:GITHUB_OUTPUT
          echo "BUILD_NUMBER=$bn" >> $env:GITHUB_ENV
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Build Vite frontend
        run: npm run build
      - name: Build Tauri Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target x86_64-pc-windows-msvc
      - name: Stage installer artifacts
        id: stage
        shell: pwsh
        run: |
          $artifact = "artifact"
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null
          $bundle = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          if (-not (Test-Path $bundle)) { $bundle = "src-tauri\target\release\bundle" }
          if (-not (Test-Path $bundle)) { throw "Tauri bundle directory not found." }
          Get-ChildItem -Path $bundle -Recurse -File -Include *.exe,*.msi,*.zip | Copy-Item -Destination $artifact -Force
          $notes = @("# CinaVault Premium Build","- Poster sidecar download implemented","- NFO write-back implemented","- Kodi skin rewrite complete","- Permanent plugins defined")
          $notes | Set-Content -Path "$artifact\RELEASE-NOTES.md" -Encoding UTF8
          $files = Get-ChildItem -Path $artifact -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
          if (-not $files) { throw 'No installer artifacts were staged.' }
          $hashLines = foreach ($file in $files) { $hash = Get-FileHash -Algorithm SHA256 -Path $file.FullName; "$($hash.Hash)  $($file.Name)" }
          $hashLines | Set-Content -Path "$artifact\SHA256SUMS.txt" -Encoding UTF8
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_build.outputs.installer_name }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.installer_name }}
          path: release-files/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ needs.build-windows.outputs.build_number }}"
          name: "CinaVault Premium Build ${{ needs.build-windows.outputs.build_number }}"
          body_path: release-files/RELEASE-NOTES.md
          draft: false
          prerelease: false
          files: |
            release-files/*.exe
            release-files/*.msi
            release-files/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  on-failure:
    name: Failure Report
    needs: [validate, build-windows]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - name: Write failure report
        run: echo "Build failed on run ${{ github.run_number }}" > failure-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: failure-report-${{ github.run_number }}
          path: failure-report.md
          retention-days: 30
