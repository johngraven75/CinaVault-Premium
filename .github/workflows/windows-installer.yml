name: Build and Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release Windows Installers
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows Installers
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Stage Installers and Generate Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path installer-staging -Force | Out-Null
          Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination installer-staging -Force

          $files = Get-ChildItem installer-staging -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          if ($files.Count -eq 0) {
            throw "No installer binaries (.exe or .msi) were found after build."
          }

          $checksums = foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)"
          }
          Set-Content -Path installer-staging\SHA256SUMS.txt -Value $checksums -Encoding utf8

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-Premium-Windows-Installers
          path: installer-staging/
          if-no-files-found: error
          retention-days: 15

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            installer-staging/*.msi
            installer-staging/*.exe
            installer-staging/SHA256SUMS.txt
