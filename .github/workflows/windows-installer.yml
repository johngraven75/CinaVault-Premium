name: Windows Installer Build 167 Beta 1

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'releases/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: build-167-beta-1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_NUMBER: '167'
  APP_VERSION: 1.6.7-beta.1
  INSTALLER_ARTIFACT_NAME: Cina