name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/cinavault-pgma-plex-plugin
      - codex/build-140-cleanup-review
    paths-ignore:
      - 'releases/**'

permissions:
  contents: write

env:
  BUILD_NUMBER: '140'
  BUILD_OUTPUT_DIR: releases/build-140
  INSTALLER_ARTIFACT_NAME: CinaVault-Premium-Windows-Installer-Build140
  BUILD_TRIGGER: manual-2026-06-29-build-140-cleanup-validation

jobs:
  build-windows-installer:
    name: Build CinaVault Premium Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh npm lockfile
        shell: pwsh
        run: |
          $branch = $env:GITHUB_REF_NAME
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin $branch
          git pull --rebase --autostash origin $branch

          npm install --package-lock-only

          git add package.json package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Refresh npm lockfile for Build ${{ env.BUILD_NUMBER }}'
            git push origin HEAD:$branch
          } else {
            Write-Host 'No package lock refresh needed.'
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        shell: pwsh
        run: npm install --legacy-peer-deps --loglevel verbose

      - name: Verify Build 140 JavaScript governance
        shell: pwsh
        run: npm run test:build140

      - name: Verify production web build
        shell: pwsh
        run: npm run build

      - name: Verify full Rust test suite
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture --test-threads=1

      - name: Verify Rust compile check
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer with Tauri
        shell: pwsh
        run: npm run tauri build

      - name: Stage installer artifacts and hashes
        shell: pwsh
        run: |
          $artifact = 'artifact'
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null

          $bundle = 'src-tauri\target\release\bundle'
          if (-not (Test-Path $bundle)) {
            throw "Installer bundle directory not found: $bundle"
          }

          Get-ChildItem -Path $bundle -Recurse -File -Include *.exe,*.msi,*.zip |
            Copy-Item -Destination $artifact -Force

          if (Test-Path 'BUILD_NOTES_PGMA.md') {
            Copy-Item 'BUILD_NOTES_PGMA.md' "$artifact\BUILD_NOTES_PGMA.md" -Force
          }

          @(
            '# CinaVault Premium Build ${{ env.BUILD_NUMBER }} Notes',
            '',
            'Build: ${{ env.BUILD_NUMBER }}',
            "Source commit: $env:GITHUB_SHA",
            "Workflow run: $env:GITHUB_RUN_ID",
            'Artifact name: ${{ env.INSTALLER_ARTIFACT_NAME }}',
            '',
            'Carries forward the Cyber HUD redesign and adds the Build 140 source-scan, metadata-provider, and validation cleanup set.',
            '',
            'Build 140 highlights:',
            '- Keeps the Hyper-Neon Fusion Cyber HUD, Quantum Grid navigation, holographic cards, quick stats, and terminal panel experience.',
            '- Restores PGMA Modernized and Porn Site Nuxt metadata provider routing through Tauri command handlers.',
            '- Requires the JavaScript surface regression test before installer creation so metadata provider wiring regressions are caught.',
            '- Continues scanning all enabled media sources even when one source is missing or fails.',
            '- Reports per-source scan counts, skipped disabled sources, failed sources, and ingestion errors instead of silently swallowing library upsert failures.',
            '- Sets source item counts from files found, not only newly added files, so rescans no longer zero out source counts.',
            '- Publishes Windows NSIS setup EXE, MSI, release notes, build notes, and SHA256 manifest.'
          ) | Set-Content -Path "$artifact\RELEASE-NOTES.md" -Encoding UTF8

          $files = Get-ChildItem -Path $artifact -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
          if (-not $files) {
            throw 'No installer artifacts were staged.'
          }

          $hashLines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $file.FullName
            "$($hash.Hash)  $($file.Name)"
          }
          $hashLines | Set-Content -Path "$artifact\SHA256SUMS.txt" -Encoding UTF8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INSTALLER_ARTIFACT_NAME }}
          path: artifact/*
          if-no-files-found: error

      - name: Publish release folder to branch
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $branch = $env:GITHUB_REF_NAME
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin $branch
          git pull --rebase --autostash origin $branch

          New-Item -ItemType Directory -Path "${{ env.BUILD_OUTPUT_DIR }}" -Force | Out-Null
          Copy-Item artifact\* "${{ env.BUILD_OUTPUT_DIR }}" -Force
          git add "${{ env.BUILD_OUTPUT_DIR }}"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Publish Windows installer artifacts for Build ${{ env.BUILD_NUMBER }}'
            git push origin HEAD:$branch
          } else {
            Write-Host 'No installer artifact changes to publish.'
          }
