name: Auto Build, Test, Release — v2 Build 1.04

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: v2-build-1-04-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 2.0.4
  TAG_NAME: v2.0.4
  ARTIFACT_NAME: CinaVault-Premium-Windows-v2-Build-1.04
  WIREGUARD_MSI_URL: https://download.wireguard.com/windows-client/wireguard-amd64-1.1.msi

jobs:
  build-test-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove existing v2 Build 1.04 release and tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw 'Failed to remove existing v2 Build 1.04 release.' }
          } else {
            git ls-remote --exit-code --tags origin "refs/tags/$env:TAG_NAME" *> $null
            if ($LASTEXITCODE -eq 0) {
              git push origin ":refs/tags/$env:TAG_NAME"
              if ($LASTEXITCODE -ne 0) { throw 'Failed to remove existing v2 Build 1.04 tag.' }
            }
          }
          exit 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify v2 Build 1.04 identity
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauriVersion = $tauri.version
          $cargoVersion = ((Get-Content src-tauri/Cargo.toml | Select-String '^version = ' | Select-Object -First 1).Line -replace 'version = ', '').Trim('"')
          if ($packageVersion -ne $env:APP_VERSION) { throw "package.json version is $packageVersion, expected $env:APP_VERSION" }
          if ($tauriVersion -ne $env:APP_VERSION) { throw "tauri.conf.json version is $tauriVersion, expected $env:APP_VERSION" }
          if ($cargoVersion -ne $env:APP_VERSION) { throw "Cargo.toml version is $cargoVersion, expected $env:APP_VERSION" }
          if ($tauri.app.windows[0].title -notmatch 'v2 Build 1\.04') { throw 'Windows title is not v2 Build 1.04.' }

      - name: Download and verify official WireGuard engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:WIREGUARD_MSI_URL -OutFile wireguard-amd64.msi
          $msiSignature = Get-AuthenticodeSignature .\wireguard-amd64.msi
          if ($msiSignature.Status -ne 'Valid') { throw "WireGuard MSI signature is not valid: $($msiSignature.Status)" }
          New-Item -ItemType Directory -Path wireguard-extracted -Force | Out-Null
          $target = (Resolve-Path .\wireguard-extracted).Path
          $process = Start-Process msiexec.exe -ArgumentList @('/a', (Resolve-Path .\wireguard-amd64.msi).Path, '/qn', "TARGETDIR=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "WireGuard extraction failed with exit code $($process.ExitCode)" }
          $engine = Get-ChildItem wireguard-extracted -Recurse -File -Filter wireguard.exe | Select-Object -First 1
          if (-not $engine) { throw 'wireguard.exe was not found in the official MSI' }
          $engineSignature = Get-AuthenticodeSignature $engine.FullName
          if ($engineSignature.Status -ne 'Valid') { throw "WireGuard executable signature is not valid: $($engineSignature.Status)" }
          New-Item -ItemType Directory -Path src-tauri\tools\wireguard -Force | Out-Null
          Copy-Item $engine.FullName src-tauri\tools\wireguard\wireguard.exe -Force

      - name: Master release gate
        run: npm run verify:master-release

      - name: Frontend validation
        run: |
          npm run lint
          npm test
          npm run build

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Refresh Rust lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Rust compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc

      - name: Build Windows installers
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Stage and verify installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path installer-staging -Force | Out-Null
          Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination installer-staging -Force
          $msi = @(Get-ChildItem installer-staging -File -Filter *.msi)
          $exe = @(Get-ChildItem installer-staging -File -Filter *.exe)
          if ($msi.Count -lt 1) { throw 'No MSI installer was produced.' }
          if ($exe.Count -lt 1) { throw 'No NSIS EXE installer was produced.' }
          $files = Get-ChildItem installer-staging -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          $checksums = foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)"
          }
          Set-Content installer-staging\SHA256SUMS.txt $checksums -Encoding utf8

      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: installer-staging/
          if-no-files-found: error
          retention-days: 30

      - name: Publish v2 Build 1.04 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: main
          name: CinaVault Premium v2 Build 1.04
          body: |
            CinaVault Premium v2 Build 1.04, version 2.0.4.

            Windows release containing the verified NSIS EXE installer and MSI package, with SHA-256 checksums. Built from main after the v2 Build 1.04 metadata, poster, shared-contract, packaging, and validation repairs.
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installer-staging/*.msi
            installer-staging/*.exe
            installer-staging/SHA256SUMS.txt
