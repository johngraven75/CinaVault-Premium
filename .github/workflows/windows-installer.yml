name: Windows Installer Build 164

on:
  push:
    branches:
      - main
      - build-164
    paths-ignore:
      - 'releases/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-164-${{ github.ref }}
  cancel-in-progress: true

en