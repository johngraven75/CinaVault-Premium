name: Windows Installer Build 164

on:
  push:
    branches:
      - main
      - build-164
    paths-ignore:
      - 'releases/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-164-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NUMBER: 164
  APP_VERSION: 1.6.4
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npm run type-check
      - name: Run Build 164 governance tests
        run: npm test
      - name: Reduce workspace footprint
        if: always()
        run: rm -rf node_modules dist coverage .cache

  build:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --nocapture
      - name: Build Tauri Windows installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc
      - name: Stage installer artifacts
        shell: pwsh
        run: |
          $stagingDir = "installer-staging"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          $bundlePath = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          Copy-Item "$bundlePath\msi\*.msi" $stagingDir -ErrorAction SilentlyContinue
          Copy-Item "$bundlePath\nsis\*.exe" $stagingDir -ErrorAction SilentlyContinue
          $files = Get-ChildItem $stagingDir -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          if (-not $files) { throw "No MSI or EXE installer was produced." }
          $checksums = foreach ($file in $files) {
            $hash = Get-FileHash -Path $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)"
          }
          Set-Content -Path "$stagingDir\SHA256SUMS.txt" -Value $checksums
      - name: Upload staging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-Premium-Windows-Installer-Build164
          path: installer-staging/
          if-no-files-found: error
          compression-level: 9
          retention-days: 15
      - name: Reduce post-build workspace footprint by at least 50 percent
        if: always()
        shell: pwsh
        run: |
          Remove-Item node_modules, dist, installer-staging -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item src-tauri\target -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.cargo\registry\src" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\.cargo\git\checkouts" -Recurse -Force -ErrorAction SilentlyContinue

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: CinaVault-Premium-Windows-Installer-Build164
          path: artifacts
      - name: Publish Build 164 release and assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.4
          name: CinaVault Premium Build 164
          body: |
            # CinaVault Premium Build 164

            Windows MSI and NSIS installers for CinaVault Premium version 1.6.4.

            This release carries forward the Build 158 metadata IPC protections, provider routing, regression coverage, and installer validation.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.msi
            artifacts/*.exe
            artifacts/SHA256SUMS.txt

  failure-report:
    name: Report Build Failure
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Build 164 Windows Installer - Build Failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-failure,windows-installer',
            });
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `Build 164 failed before publication.\n\n[View workflow run](${runUrl})`,
                labels: ['build-failure', 'windows-installer'],
              });
            }
