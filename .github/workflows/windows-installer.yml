name: Build 170 Automation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-170-release
  cancel-in-progress: true

env:
  BUILD_NUMBER: '170'
  APP_VERSION: 1.7.0
  TAG_NAME: v1.7.0
  ARTIFACT_NAME: CinaVault-Premium-Windows-Installer-Build170
  WIREGUARD_MSI_URL: https://download.wireguard.com/windows-client/wireguard-amd64-1.1.m