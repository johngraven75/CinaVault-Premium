name: CinaVault Premium — Windows Installer (Auto Build, Test, Cleanup & Release)

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - ".github/workflows/apisec-scan.yml"
      - ".github/workflows/ethicalcheck.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force a GitHub release even if not on main"
        required: false
        default: "false"
      build_number_override:
        description: "Override build number (leave blank for auto)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read
  issues: write

env:
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: stable

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Validate — TypeScript + Rust type-check, security audit
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate (TS + Rust + Security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript strict type-check
        run: npm run type-check

      - name: TypeScript build check
        run: npm run build

      - name: Install Linux Tauri system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Cargo check (all features)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo clippy (warnings as errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
        continue-on-error: true

      - name: npm security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Cargo security audit (cargo-audit)
        run: |
          cargo install cargo-audit --quiet 2>/dev/null || true
          cargo audit --manifest-path src-tauri/Cargo.toml
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Test — governance, carry-forward verification, unit tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite (Governance + Carry-Forward + Unit)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run full governance test suite
        run: npm run test:all

      - name: Run carry-forward verification
        run: npm run test:carry-forward

      - name: Install Linux Tauri system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture 2>&1 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            docs/CARRY_FORWARD_REPORT_*.md
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Cleanup — automated post-build cleanup, dead-code removal, formatting
  # ─────────────────────────────────────────────────────────────────────────────
  cleanup:
    name: Post-Build Cleanup & Organization
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Run automated cleanup script
        run: node scripts/cleanup.mjs --verbose

      - name: Check for cleanup changes to commit
        id: cleanup_diff
        run: |
          git config user.name "CinaVault CI Bot"
          git config user.email "ci@cinavault.app"
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --cached --name-only
          fi

      - name: Commit cleanup changes
        if: steps.cleanup_diff.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        run: |
          git commit -m "chore(cleanup): automated post-build cleanup [skip ci]"
          git push

      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-report-${{ github.run_number }}
          path: docs/cleanup-reports/
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Build Windows Installer
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Installer (.exe + .msi)
    needs: cleanup
    runs-on: windows-latest
    outputs:
      build_number: ${{ steps.set_build.outputs.build_number }}
      installer_name: ${{ steps.set_build.outputs.installer_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set build number
        id: set_build
        shell: pwsh
        run: |
          $bn = if ('${{ github.event.inputs.build_number_override }}') {
            '${{ github.event.inputs.build_number_override }}'
          } else {
            '${{ github.run_number }}'
          }
          echo "build_number=$bn" >> $env:GITHUB_OUTPUT
          echo "installer_name=CinaVault-Premium-Windows-Build-$bn" >> $env:GITHUB_OUTPUT
          echo "BUILD_NUMBER=$bn" >> $env:GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build Vite frontend
        run: npm run build

      - name: Build Tauri Windows installer (NSIS + WiX)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Stage installer artifacts
        id: stage
        shell: pwsh
        run: |
          $artifact = "artifact"
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null

          $bundle = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          if (-not (Test-Path $bundle)) { $bundle = "src-tauri\target\release\bundle" }
          if (-not (Test-Path $bundle)) { throw "Tauri bundle directory not found." }

          # Copy all installer files
          Get-ChildItem -Path $bundle -Recurse -File -Include *.exe,*.msi,*.zip |
            Copy-Item -Destination $artifact -Force

          # Copy release notes from docs/releases if present
          $releaseNotes = "docs\releases\RELEASE_NOTES_BUILD${{ steps.set_build.outputs.build_number }}.md"
          if (Test-Path $releaseNotes) {
            Copy-Item $releaseNotes "$artifact\RELEASE-NOTES.md" -Force
          } else {
            # Fallback: generate minimal release notes
            @(
              "# CinaVault Premium Build ${{ steps.set_build.outputs.build_number }}",
              "",
              "## Included in this build",
              "- Full carry-forward verification passed",
              "- Automated post-build cleanup completed",
              "- All governance tests passed",
              "",
              "See docs/CARRY_FORWARD.md for the full feature registry."
            ) | Set-Content -Path "$artifact\RELEASE-NOTES.md" -Encoding UTF8
          }

          # Verify at least one installer was staged
          $files = Get-ChildItem -Path $artifact -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
          if (-not $files) { throw "No installer artifacts were staged." }

          # Generate SHA256 checksums
          $hashLines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $file.FullName
            "$($hash.Hash)  $($file.Name)"
          }
          $hashLines | Set-Content -Path "$artifact\SHA256SUMS.txt" -Encoding UTF8

          # List what was staged
          Write-Host "Staged artifacts:"
          Get-ChildItem -Path $artifact | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_build.outputs.installer_name }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Release — create GitHub Release with installers
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') ||
      github.event.inputs.force_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.installer_name }}
          path: release-files/

      - name: List release files
        run: ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ needs.build-windows.outputs.build_number }}"
          name: "CinaVault Premium — Build ${{ needs.build-windows.outputs.build_number }}"
          body_path: release-files/RELEASE-NOTES.md
          draft: false
          prerelease: false
          files: |
            release-files/*.exe
            release-files/*.msi
            release-files/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6: On-Failure — self-healing issue creation
  # ─────────────────────────────────────────────────────────────────────────────
  on-failure:
    name: Self-Healing Failure Report
    needs: [validate, test, cleanup, build-windows]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Collect failure context
        id: context
        run: |
          echo "run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "commit=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Create self-healing GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Build Failure — Run #${{ github.run_number }} on ${{ steps.context.outputs.branch }}`;
            const body = [
              `## CinaVault Premium CI Build Failure`,
              ``,
              `**Branch:** \`${{ steps.context.outputs.branch }}\``,
              `**Commit:** \`${{ steps.context.outputs.commit }}\``,
              `**Run:** [${{ github.run_number }}](${{ steps.context.outputs.run_url }})`,
              `**Triggered by:** ${{ github.actor }}`,
              ``,
              `## What to do`,
              `1. Click the run link above to see which job failed and why.`,
              `2. Check the validate job for TypeScript or Rust compile errors.`,
              `3. Check the test job for carry-forward governance failures.`,
              `4. Check the cleanup job for formatting or file-organization errors.`,
              `5. Fix the issue, push a commit, and the CI will re-run automatically.`,
              ``,
              `---`,
              `*This issue was created automatically by the CinaVault CI self-healing workflow.*`,
            ].join('\n');

            // Check for existing open issue for this run to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
            });
            const alreadyOpen = existing.data.some(i => i.title.includes('Run #${{ github.run_number }}'));
            if (!alreadyOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure', 'automated'],
              });
            }

      - name: Upload failure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: failure-report-${{ github.run_number }}
          path: |
            .github/
          retention-days: 30
          if-no-files-found: ignore
