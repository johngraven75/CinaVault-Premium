name: CinaVault Premium — Windows Installer (Auto Build & Release)

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - ".github/workflows/apisec-scan.yml"
      - ".github/workflows/ethicalcheck.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force a GitHub release even if not on main"
        required: false
        default: "false"
      build_number_override:
        description: "Override build number (leave blank for auto)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: stable

jobs:
  # ── 1. Validate TypeScript & Rust ──────────────────────────────────────
  validate:
    name: Validate (TS + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript type-check & build
        run: npm run build

      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run all Rust unit tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture 2>&1 || true

      - name: npm security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── 2. Build Windows Installer ─────────────────────────────────────────
  build-windows:
    name: Build Windows Installer
    needs: validate
    runs-on: windows-latest
    outputs:
      build_number: ${{ steps.set_build.outputs.build_number }}
      installer_name: ${{ steps.set_build.outputs.installer_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set build number
        id: set_build
        shell: pwsh
        run: |
          $bn = if ('${{ github.event.inputs.build_number_override }}') {
            '${{ github.event.inputs.build_number_override }}'
          } else {
            '${{ github.run_number }}'
          }
          echo "build_number=$bn" >> $env:GITHUB_OUTPUT
          echo "installer_name=CinaVault-Premium-Windows-Build-$bn" >> $env:GITHUB_OUTPUT
          echo "BUILD_NUMBER=$bn" >> $env:GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Refresh npm lockfile
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $branch = $env:GITHUB_REF_NAME
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin $branch
          git pull --rebase --autostash origin $branch
          npm install --package-lock-only
          git add package.json package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "ci: refresh npm lockfile for Build $env:BUILD_NUMBER [skip ci]"
            git push origin "HEAD:$branch"
          }

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build Vite frontend
        run: npm run build

      - name: Verify Rust compile
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml scanner::tests -- --nocapture --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml metadata_posting_tests -- --nocapture --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml db::tests -- --nocapture --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml enrichment::tests -- --nocapture --test-threads=1

      - name: Build Tauri Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Stage installer artifacts
        id: stage
        shell: pwsh
        run: |
          $artifact = "artifact"
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null

          $bundle = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          if (-not (Test-Path $bundle)) { $bundle = "src-tauri\target\release\bundle" }
          if (-not (Test-Path $bundle)) { throw "Tauri bundle directory not found." }

          Get-ChildItem -Path $bundle -Recurse -File -Include *.exe,*.msi,*.zip |
            Copy-Item -Destination $artifact -Force

          $notes = @(
            "# CinaVault Premium — Build $env:BUILD_NUMBER",
            "",
            "**Build:** $env:BUILD_NUMBER  |  **Commit:** $env:GITHUB_SHA  |  **Branch:** $env:GITHUB_REF_NAME",
            "",
            "## What's New",
            "- Poster images downloaded to disk as ``{video-name}-poster.jpg`` sidecar files",
            "- NFO XML sidecar files written alongside every enriched media file",
            "- ``gather_adult_metadata`` Tauri command registered and functional",
            "- Complete Kodi skin rewrite: Estuary Cinema, Aeon Nox Lux, Arctic Zephyr, Titan Bingie, Amber Home",
            "- New KodiHomeLayout: hero banner, horizontal shelves, poster wall, detail panel",
            "- Permanent media plugins: FFmpeg, FFprobe, yt-dlp, MediaInfo, MKVToolNix fully defined",
            "- Version bumped to 1.0.$env:BUILD_NUMBER",
            "",
            "## Installation",
            "1. Download the ``.exe`` (NSIS) or ``.msi`` installer below",
            "2. Run installer — click **More info → Run anyway** if SmartScreen appears",
            "3. Launch CinaVault Premium from Start Menu or Desktop",
            "",
            "## Verify Integrity",
            "Check ``SHA256SUMS.txt`` to verify your download."
          )
          $notes | Set-Content -Path "$artifact\RELEASE-NOTES.md" -Encoding UTF8

          $files = Get-ChildItem -Path $artifact -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
          if (-not $files) { throw 'No installer artifacts were staged.' }
          $hashLines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $file.FullName
            "$($hash.Hash)  $($file.Name)"
          }
          $hashLines | Set-Content -Path "$artifact\SHA256SUMS.txt" -Encoding UTF8

          Write-Host "=== Staged artifacts ==="
          Get-ChildItem -Path $artifact -File | ForEach-Object { Write-Host $_.Name }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_build.outputs.installer_name }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish artifacts to repo
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $branch = $env:GITHUB_REF_NAME
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin $branch
          git pull --rebase --autostash origin $branch
          $outDir = "release-artifacts/build-$env:BUILD_NUMBER"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Copy-Item artifact/* $outDir -Force
          git add $outDir
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "ci: publish Windows installer artifacts for Build $env:BUILD_NUMBER [skip ci]"
            git push origin "HEAD:$branch"
          }

  # ── 3. Create GitHub Release (main branch only) ────────────────────────
  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || github.event.inputs.force_release == 'true') &&
      github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.installer_name }}
          path: release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ needs.build-windows.outputs.build_number }}"
          name: "CinaVault Premium — Build ${{ needs.build-windows.outputs.build_number }}"
          body_path: release-files/RELEASE-NOTES.md
          draft: false
          prerelease: false
          files: |
            release-files/*.exe
            release-files/*.msi
            release-files/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Failure notification ────────────────────────────────────────────
  on-failure:
    name: Failure Report
    needs: [validate, build-windows]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - name: Write failure report
        run: |
          cat > failure-report.md << EOF
          ## CinaVault Build Failure — Run ${{ github.run_number }}
          - **Validate:** ${{ needs.validate.result }}
          - **Build Windows:** ${{ needs.build-windows.result }}
          - **Commit:** ${{ github.sha }}
          - **Branch:** ${{ github.ref_name }}
          - **Actor:** ${{ github.actor }}
          EOF
          cat failure-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: failure-report-${{ github.run_number }}
          path: failure-report.md
          retention-days: 30
