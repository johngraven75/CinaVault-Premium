name: Windows Installer Build 168

# Auto Build, Test, Cleanup

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: build-168
  cancel-in-progress: false

env:
  BUILD_NUMBER: '168'
  APP_VERSION: 1.6.8
  TAG_NAME: v1.6.8
  ARTIFACT_NAME: CinaVault-Premium-Windows-Installer-Build168

jobs:
  build-and-release:
    runs-on: windows-latest
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Check for existing release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          exit 0

      - name: Setup Node.js
        if: steps.release.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        if: steps.release.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        if: steps.release.outputs.exists != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        if: steps.release.outputs.exists != 'true'
        run: npm install

      - name: Validate and test
        if: steps.release.outputs.exists != 'true'
        run: |
          npm run lint
          npm test

      - name: Build Windows installers
        if: steps.release.outputs.exists != 'true'
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Stage installers and checksums
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path installer-staging -Force | Out-Null
          Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination installer-staging -Force
          $files = Get-ChildItem installer-staging -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          if (-not $files) { throw 'No MSI or EXE installer was produced.' }
          $checksums = foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)"
          }
          Set-Content installer-staging\SHA256SUMS.txt $checksums -Encoding utf8

      - name: Upload workflow artifact
        if: steps.release.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: installer-staging/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Build 168 release
        if: steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: main
          name: CinaVault Premium Build 168
          body: |
            Windows MSI and NSIS installers for CinaVault Premium Build 168, version 1.6.8.
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installer-staging/*.msi
            installer-staging/*.exe
            installer-staging/SHA256SUMS.txt