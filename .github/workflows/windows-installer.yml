name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/cinavault-pgma-plex-plugin
      - codex/cyber-hud-build-137
    paths-ignore:
      - 'releases/**'

permissions:
  contents: write

env:
  BUILD_NUMBER: '138'
  BUILD_OUTPUT_DIR: releases/build-138
  INSTALLER_ARTIFACT_NAME: CinaVault-Premium-Windows-Installer-Build138
  BUILD_TRIGGER: manual-2026-06-26-build-138

jobs:
  build-windows-installer:
    name: Build CinaVault Premium Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh npm lockfile
        shell: pwsh
        run: |
          npm install --package-lock-only

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Refresh npm lockfile for Build ${{ env.BUILD_NUMBER }}'
            git push
          } else {
            Write-Host 'No package lock refresh needed.'
          }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build installer with one-step PowerShell script
        shell: pwsh
        working-directory: ./
        run: .\scripts\build-installer.ps1 -NoDesktopCopy -NoOpenDesktop

      - name: Stage installer artifacts and hashes
        shell: pwsh
        run: |
          $artifact = 'artifact'
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null

          $bundle = 'src-tauri\target\release\bundle'
          if (-not (Test-Path $bundle)) {
            throw "Installer bundle directory not found: $bundle"
          }

          Get-ChildItem -Path $bundle -Recurse -File -Include *.exe,*.msi,*.zip |
            Copy-Item -Destination $artifact -Force

          if (Test-Path 'BUILD_NOTES_PGMA.md') {
            Copy-Item 'BUILD_NOTES_PGMA.md' "$artifact\BUILD_NOTES_PGMA.md" -Force
          }

          @(
            '# CinaVault Premium Build ${{ env.BUILD_NUMBER }} Notes',
            '',
            'Build: ${{ env.BUILD_NUMBER }}',
            "Source commit: $env:GITHUB_SHA",
            "Workflow run: $env:GITHUB_RUN_ID",
            'Artifact name: ${{ env.INSTALLER_ARTIFACT_NAME }}',
            '',
            'Carries forward the Build 137 Cyber HUD redesign and adds the Build 138 metadata repair validation set.',
            '',
            'Build 138 highlights:',
            '- Keeps the Hyper-Neon Fusion Cyber HUD, Quantum Grid navigation, holographic cards, quick stats, and terminal panel experience from Build 137.',
            '- Restores always-visible per-media Check Metadata actions on library cards and list/table surfaces.',
            '- Reports metadata gather results with scanned, enriched, updated-field, poster, sidecar, and chapter-image counts instead of a generic completion message.',
            '- Requires a Rust regression test proving metadata and poster URLs are posted to an actual media row before installer creation.',
            '- Publishes Windows NSIS setup EXE, MSI, release notes, build notes, and SHA256 manifest.'
          ) | Set-Content -Path "$artifact\RELEASE-NOTES.md" -Encoding UTF8

          $files = Get-ChildItem -Path $artifact -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
          if (-not $files) {
            throw 'No installer artifacts were staged.'
          }

          $hashLines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $file.FullName
            "$($hash.Hash)  $($file.Name)"
          }
          $hashLines | Set-Content -Path "$artifact\SHA256SUMS.txt" -Encoding UTF8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INSTALLER_ARTIFACT_NAME }}
          path: artifact/*
          if-no-files-found: error

      - name: Publish installer files to repository
        shell: pwsh
        run: |
          $destination = '${{ env.BUILD_OUTPUT_DIR }}'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item artifact\* $destination -Force

          @(
            '# CinaVault Premium Build ${{ env.BUILD_NUMBER }} Installer Artifacts',
            '',
            'Build: ${{ env.BUILD_NUMBER }}',
            "Source commit: $env:GITHUB_SHA",
            "Workflow run: $env:GITHUB_RUN_ID",
            'Artifact name: ${{ env.INSTALLER_ARTIFACT_NAME }}',
            '',
            'The generated installer files, SHA256 manifest, release notes, and build notes in this folder were produced by the Windows installer workflow after metadata/poster persistence validation.',
            '',
            'Expected installer outputs:',
            '- CinaVault Premium_1.0.138_x64-setup.exe',
            '- CinaVault Premium_1.0.138_x64_en-US.msi'
          ) | Set-Content -Path "$destination\INSTALLER-UPLOAD-REPORT.md" -Encoding UTF8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $destination
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Upload Build ${{ env.BUILD_NUMBER }} Windows installer artifacts'
            git push
          } else {
            Write-Host 'No installer artifact changes to publish.'
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'build-${{ env.BUILD_NUMBER }}'
          $title = 'CinaVault Premium Build ${{ env.BUILD_NUMBER }}'
          git fetch --tags
          if (-not (git tag --list $tag)) {
            git tag $tag $env:GITHUB_SHA
            git push origin $tag
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag artifact\* --repo $env:GITHUB_REPOSITORY --title $title --notes-file artifact\RELEASE-NOTES.md
          } else {
            gh release upload $tag artifact\* --repo $env:GITHUB_REPOSITORY --clobber
          }
