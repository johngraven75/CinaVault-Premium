name: Windows Installer Build 157

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'releases/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  BUILD_NUMBER: 157
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Rust compilation
        run: cargo check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:all 2>&1 || true

  build:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Run Rust tests
        run: cargo test -- --nocapture
      - name: Build Tauri Windows installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc
      - name: Stage installer artifacts
        shell: pwsh
        run: |
          $stagingDir = "installer-staging"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          $bundlePath = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          Copy-Item "$bundlePath\msi\*.msi" $stagingDir -ErrorAction SilentlyContinue -Verbose
          Copy-Item "$bundlePath\nsis\*.exe" $stagingDir -ErrorAction SilentlyContinue -Verbose
          $files = Get-ChildItem $stagingDir -Include *.msi, *.exe
          if ($files) {
            $checksums = @()
            foreach ($file in $files) {
              $hash = Get-FileHash -Path $file.FullName -Algorithm SHA256
              $checksums += "$($hash.Hash)  $($file.Name)"
            }
            Set-Content -Path "$stagingDir\SHA256SUMS.txt" -Value $checksums
          }
      - name: Upload staging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-Premium-Windows-Installer-Build157
          path: installer-staging/
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: CinaVault-Premium-Windows-Installer-Build157
          path: artifacts/
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.157-windows
          release_name: 'CinaVault Premium Build 157 - Windows Version'
          body: |
            # CinaVault Premium Build 157 - Windows Release
            
            This release contains the Windows installers for Build 157.
            
            ## Installation
            ### Via MSI (Recommended)
            ```powershell
            msiexec /i "CinaVault-Premium-Build157-Installer.msi" MSIINSTALLPERUSER=1 ALLUSERS=2 /qn /norestart
            ```
            
            ### Via EXE
            Double-click the `.exe` file and follow prompts.
            
            ## Changes in Build 157
            - Build 157 metadata IPC fix and validation alignment
            - Aligns Tauri version metadata to 1.5.7
            - Enhanced validation tests
            
            [PR #22](https://github.com/johngraven75/CinaVault-Premium/pull/22)
          draft: false
          prerelease: false

  on-failure:
    name: Report Build Failure
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build 157 Windows Installer - Build Failed`,
              body: `Build 157 Windows installer workflow failed.\n\n[View workflow run](${runUrl})`,
              labels: ['build-failure', 'windows-installer']
            });
