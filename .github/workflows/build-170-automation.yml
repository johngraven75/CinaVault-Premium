name: Build 170 Automation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  security-events: write
  actions: read

concurrency:
  group: build-170-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NUMBER: '170'
  APP_VERSION: 1.7.0
  TAG_NAME: v1.7.0
  ARTIFACT_NAME: CinaVault-Premium-Windows-Installer-Build170
  WIREGUARD_MSI_URL: https://download.wireguard.com/windows-client/wireguard-amd64-1.1.msi

jobs:
  validate:
    name: Validate frontend and Rust
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Frontend validation
        run: |
          npm run lint
          npm test
          npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets --locked

      - name: Rust compile check
        working-directory: src-tauri
        run: cargo check --locked --target x86_64-pc-windows-msvc

      - name: Dependency audit
        shell: pwsh
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
          npm audit --audit-level=high

  build-windows:
    name: Build and verify Windows installers
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Download and verify official WireGuard engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:WIREGUARD_MSI_URL -OutFile wireguard-amd64.msi
          $msiSignature = Get-AuthenticodeSignature .\wireguard-amd64.msi
          if ($msiSignature.Status -ne 'Valid') {
            throw "WireGuard MSI signature is not valid: $($msiSignature.Status)"
          }
          New-Item -ItemType Directory -Path wireguard-extracted -Force | Out-Null
          $target = (Resolve-Path .\wireguard-extracted).Path
          $process = Start-Process msiexec.exe -ArgumentList @('/a', (Resolve-Path .\wireguard-amd64.msi).Path, '/qn', "TARGETDIR=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "WireGuard administrative extraction failed with exit code $($process.ExitCode)"
          }
          $engine = Get-ChildItem wireguard-extracted -Recurse -File -Filter wireguard.exe | Select-Object -First 1
          if (-not $engine) {
            throw 'wireguard.exe was not found in the official MSI'
          }
          $engineSignature = Get-AuthenticodeSignature $engine.FullName
          if ($engineSignature.Status -ne 'Valid') {
            throw "WireGuard executable signature is not valid: $($engineSignature.Status)"
          }
          New-Item -ItemType Directory -Path src-tauri\tools\wireguard -Force | Out-Null
          Copy-Item $engine.FullName src-tauri\tools\wireguard\wireguard.exe -Force
          if (-not (Test-Path src-tauri\tools\wireguard\wireguard.exe)) {
            throw 'Bundled WireGuard engine staging failed'
          }

      - name: Build Windows installers
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Stage and verify installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path installer-staging -Force | Out-Null
          Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination installer-staging -Force
          $msi = Get-ChildItem installer-staging -File -Filter *.msi
          $exe = Get-ChildItem installer-staging -File -Filter *.exe
          if (-not $msi) { throw 'No MSI installer was produced.' }
          if (-not $exe) { throw 'No NSIS EXE installer was produced.' }
          $files = Get-ChildItem installer-staging -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          $checksums = foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)"
          }
          Set-Content installer-staging\SHA256SUMS.txt $checksums -Encoding utf8
          Get-Content installer-staging\SHA256SUMS.txt

      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: installer-staging/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Build 170
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: installer-staging

      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find installer-staging -maxdepth 1 -type f -name '*.msi' -print -quit)"
          test -n "$(find installer-staging -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -s installer-staging/SHA256SUMS.txt
          (cd installer-staging && sha256sum -c SHA256SUMS.txt)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: main
          name: CinaVault Premium Build 170
          body: |
            CinaVault Premium Build 170, version 1.7.0.

            Includes verified Windows MSI and NSIS installers, persistent WireGuard profile support, source scan diagnostics, and metadata reliability fixes.
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installer-staging/*.msi
            installer-staging/*.exe
            installer-staging/SHA256SUMS.txt
