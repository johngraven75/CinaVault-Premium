name: Build CinaVault Premium Windows Installer

on:
  push:
    branches: [ "tauri-premium" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'CinaVault-Premium-v__VERSION__ (Public Beta 1)'
          releaseBody: |
            ## CinaVault Premium — Public Beta 1

            **Engine:** Tauri v2 + Rust + React/TypeScript
            **Build:** v109 Premium Rewrite

            ### Features
            - 11-tab premium UI with glassmorphism, particle effects, and comet animations
            - Full media library with card/list views, search, filters, and verification
            - Media source scanner with AI discovery
            - Xtream Codes IPTV with channel groups and EPG sync
            - Jellyfin/Emby server management with library import
            - 30+ metadata providers with API key management
            - Plugin repository system
            - yt-dlp/ffmpeg download engine
            - Windscribe VPN integration
            - Windows Defender antivirus controls
            - AI diagnostics via HuggingFace Inference
            - Cloud & NAS connections (WD My Cloud, Synology, remote endpoints)
            - 6 premium theme presets
            - Emby SDK feature matrix with 40+ toggleable features
            - Duplicate file finder
            - Chapter thumbnail generator
            - User groups and media request queue

            ### Installation
            Download the `.msi` or `.exe` installer below and run it.
          releaseDraft: false
          prerelease: true

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-Premium-Installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 90
