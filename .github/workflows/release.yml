name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example build-169
        required: true
        default: build-169
      prerelease:
        description: Publish as a prerelease
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "build-*"
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Regression Gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Carry-forward regression tests
        run: npm run test:all

      - name: Production frontend build
        run: npm run build

  windows-installers:
    name: Windows MSI and NSIS
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri installers
        run: npm run tauri build

      - name: Collect installer artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Copy-Item -Destination release-assets
          if (-not (Get-ChildItem release-assets -File)) {
            throw 'No MSI or NSIS installer artifacts were produced.'
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cinavault-windows-installers-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            "tag=${{ inputs.release_tag }}" >> $env:GITHUB_OUTPUT
            "prerelease=${{ inputs.prerelease }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            "prerelease=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: CinaVault Premium ${{ steps.release.outputs.tag }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*
