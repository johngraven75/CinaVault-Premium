name: One-shot Build 170 version and validation

on:
  push:
    branches: [fix/metadata-scan-bundled-vpn, main]
    paths: [.github/workflows/one-shot-build170-version-validate.yml]

permissions:
  contents: write

jobs:
  version-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Apply Build 170 version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm version 1.7.0 --no-git-tag-version
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = $cargo -replace '(?m)^version = "1\.6\.8"$', 'version = "1.7.0"'
          Set-Content src-tauri/Cargo.toml $cargo -NoNewline
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauri.version = '1.7.0'
          $tauri | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json
          $main = Get-Content src-tauri/src/main.rs -Raw
          $main = $main.Replace('Build 168', 'Build 170').Replace('"version": "1.6.8"', '"version": "1.7.0"').Replace('"build": "168"', '"build": "170"')
          Set-Content src-tauri/src/main.rs $main -NoNewline
          if (Test-Path tests/buildNumberDriftGuard.test.mjs) {
            $guard = Get-Content tests/buildNumberDriftGuard.test.mjs -Raw
            $guard = $guard.Replace('currentBuild = 166', 'currentBuild = 170').Replace("currentVersion = '1.6.6'", "currentVersion = '1.7.0'").Replace('currentVersion = "1.6.6"', 'currentVersion = "1.7.0"')
            Set-Content tests/buildNumberDriftGuard.test.mjs $guard -NoNewline
          }
          Remove-Item .github/workflows/one-shot-build170-version-validate.yml
      - name: Install dependencies
        run: npm ci
      - name: Frontend validation
        run: |
          npm run lint
          npm test
          npm run build
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - name: Rust compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc
      - name: Commit validated Build 170 version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare and validate CinaVault Premium Build 170"
          git push origin "HEAD:$env:GITHUB_REF_NAME"

