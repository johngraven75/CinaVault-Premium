name: CinaVault ReImagined Windows v0.0.1

on:
  push:
    branches:
      - feat/cinavault-reimagined-v0.0.1
    paths:
      - 'apps/cinavault-reimagined/**'
      - '.github/workflows/cinavault-reimagined-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/cinavault-reimagined/**'
      - '.github/workflows/cinavault-reimagined-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinavault-reimagined-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build-windows:
    name: Validate and build Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/cinavault-reimagined

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cinavault-reimagined/package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/cinavault-reimagined/src-tauri -> target

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Production frontend build
        run: npm run build

      - name: Rust validation
        working-directory: apps/cinavault-reimagined/src-tauri
        run: cargo check --locked=false

      - name: Build MSI and NSIS installers
        run: npm run desktop:build
        env:
          CI: true

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-ReImagined-v0.0.1-Windows
          path: |
            apps/cinavault-reimagined/src-tauri/target/release/bundle/msi/*.msi
            apps/cinavault-reimagined/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-ReImagined-v0.0.1-build-diagnostics
          path: |
            apps/cinavault-reimagined/package-lock.json
            apps/cinavault-reimagined/src-tauri/Cargo.lock
          if-no-files-found: ignore
          retention-days: 7
