name: CinaVault ReImagined Windows v0.0.1

on:
  push:
    branches:
      - main
      - feat/cinavault-reimagined-v0.0.1
    paths:
      - 'apps/cinavault-reimagined/**'
      - '.github/workflows/cinavault-reimagined-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/cinavault-reimagined/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'docs/CARRY_FORWARD.md'
      - '.github/workflows/cinavault-reimagined-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinavault-reimagined-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build-windows:
    name: Validate parity and build Windows installers
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/cinavault-reimagined

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare diagnostics directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path test-results | Out-Null

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/cinavault-reimagined/src-tauri -> target

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund 2>&1 | Tee-Object -FilePath test-results/npm-install.log

      - name: Enforce complete legacy feature parity
        shell: pwsh
        run: npm test 2>&1 | Tee-Object -FilePath test-results/feature-parity.log

      - name: Run existing carry-forward governance
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: node tests/carryForwardVerification.test.mjs 2>&1 | Tee-Object -FilePath apps/cinavault-reimagined/test-results/carry-forward.log

      - name: TypeScript validation
        shell: pwsh
        run: npm run typecheck 2>&1 | Tee-Object -FilePath test-results/typecheck.log

      - name: Production frontend build
        shell: pwsh
        run: npm run build 2>&1 | Tee-Object -FilePath test-results/frontend-build.log

      - name: Prepare Windows application icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          Copy-Item ../../src-tauri/icons/icon.ico src-tauri/icons/icon.ico -Force
          if (-not (Test-Path src-tauri/icons/icon.ico)) { throw 'Windows icon preparation failed.' }

      - name: Rust validation
        working-directory: ${{ github.workspace }}/apps/cinavault-reimagined/src-tauri
        shell: pwsh
        run: cargo check 2>&1 | Tee-Object -FilePath ../test-results/cargo-check.log

      - name: Build MSI and NSIS installers
        shell: pwsh
        run: npm run desktop:build 2>&1 | Tee-Object -FilePath test-results/desktop-build.log
        env:
          CI: true

      - name: Generate verified build notes
        shell: pwsh
        run: |
          @"
          # CinaVault ReImagined v0.0.1

          Verified by GitHub Actions run ${{ github.run_number }} on commit ${{ github.sha }}.

          - Feature parity: passed
          - Carry-forward governance: passed
          - TypeScript validation: passed
          - Production frontend build: passed
          - Rust validation: passed
          - MSI packaging: passed
          - NSIS packaging: passed
          "@ | Set-Content test-results/BUILD_NOTES.md -Encoding utf8

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-ReImagined-v0.0.1-Windows
          path: |
            apps/cinavault-reimagined/src-tauri/target/release/bundle/msi/*.msi
            apps/cinavault-reimagined/src-tauri/target/release/bundle/nsis/*.exe
            apps/cinavault-reimagined/test-results/BUILD_NOTES.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish CinaVault ReImagined v0.0.1 release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cinavault-reimagined-v0.0.1
          target_commitish: ${{ github.sha }}
          name: CinaVault ReImagined v0.0.1
          body_path: apps/cinavault-reimagined/test-results/BUILD_NOTES.md
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            apps/cinavault-reimagined/src-tauri/target/release/bundle/msi/*.msi
            apps/cinavault-reimagined/src-tauri/target/release/bundle/nsis/*.exe
            apps/cinavault-reimagined/test-results/BUILD_NOTES.md

      - name: Upload test results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-ReImagined-v0.0.1-build-diagnostics
          path: |
            apps/cinavault-reimagined/test-results/**
            apps/cinavault-reimagined/package-lock.json
            apps/cinavault-reimagined/src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 7
