# APIsec scan. The scan is skipped cleanly when repository credentials are not configured.
name: APIsec

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '32 14 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-apisec-scan:
    name: APIsec scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      APISEC_USERNAME: ${{ secrets.apisec_username }}
      APISEC_PASSWORD: ${{ secrets.apisec_password }}

    steps:
      - name: Check APIsec configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$APISEC_USERNAME" && -n "$APISEC_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "APIsec credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "APIsec scan skipped: apisec_username and/or apisec_password is not configured."
          fi

      - name: APIsec scan
        if: steps.config.outputs.configured == 'true'
        uses: apisec-inc/apisec-run-scan@025432089674a28ba8fb55f8ab06c10215e772ea
        with:
          apisec-username: ${{ secrets.apisec_username }}
          apisec-password: ${{ secrets.apisec_password }}
          apisec-project: VAmPI
          sarif-result-file: apisec-results.sarif

      - name: Import results
        if: steps.config.outputs.configured == 'true' && success()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./apisec-results.sarif
