# Repository-wide Automation Settings
# This file documents the automation configuration for CinaVault-Premium

## Automation Schedule

### Daily Automations
- **Metadata Enhancement**: Every 6 hours (metadata-enhancement-workflow.yml)
- **Automated Testing**: Every 4 hours (automated-testing.yml)

### Weekly Automations  
- **Dependency Updates**: Every Monday at 2 AM UTC (dependency-updates.yml)
- **Dependabot**: Every Monday at 9 AM UTC (dependabot.yml)
- **Documentation Generation**: Every Sunday at midnight UTC (documentation-generation.yml)

### Event-Driven Automations
- **Release Publishing**: On push to main with version changes (app-start-release.yml)
- **Security Scanning**: On push and schedule (apisec-scan.yml)
- **Library Maintenance**: On schedule (library-maintenance.yml)

